<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F6.0 会员卡全生命周期原型 · D9 方案</title>
<style>
:root{
  --blue:#409EFF; --blue-d:#337ecc; --green:#67c23a; --green-d:#5daf34;
  --brand:#667eea; --brand2:#764ba2;
  --gold:#C9A66B; --gold-d:#B8956A; --gold-l:#DBC18A;
  --gold-grad:linear-gradient(135deg,#C9A66B 0%,#D4AF77 50%,#E8D5B7 100%);
  --gold-grad-btn:linear-gradient(135deg,#d4b896 0%,#c9a66b 100%);
  --red:#f56c6c; --orange:#e6a23c; --gray:#909399; --gray-l:#c0c4cc;
  --bg:#f0f2f5; --card:#fff; --border:#ebeef5; --border-d:#dcdfe6;
  --text:#303133; --text-2:#606266; --text-3:#909399;
  --shadow:0 2px 12px 0 rgba(0,0,0,.08); --shadow-d:0 2px 16px 0 rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:1px solid var(--border-d);background:#fff;color:var(--text-2);border-radius:4px;padding:7px 14px;font-size:13px;transition:.1s}
button:hover{color:var(--blue);border-color:#c6e2ff;background:#ecf5ff}
button:disabled{cursor:not-allowed;color:var(--gray-l);background:#f5f7fa;border-color:#e4e7ed}
.btn-primary{background:linear-gradient(135deg,#409eff 0%,#3a8ee6 100%);border:none;color:#fff;box-shadow:0 2px 8px rgba(64,158,255,.3)}
.btn-primary:hover{background:linear-gradient(135deg,#3a8ee6 0%,#337ecc 100%);color:#fff;box-shadow:0 4px 12px rgba(64,158,255,.4);transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0)}
.btn-success{background:var(--green);border-color:var(--green);color:#fff}
.btn-success:hover{background:var(--green-d);border-color:var(--green-d);color:#fff}
/* 危险按钮对齐真实 admin-web `.el-button--danger`（渐变红 + 阴影 + hover 位移） */
.btn-danger{background:linear-gradient(135deg,#f56c6c 0%,#e04040 100%);border:none;color:#fff;box-shadow:0 2px 8px rgba(245,108,108,.3)}
.btn-danger:hover{background:linear-gradient(135deg,#f56c6c 0%,#e04040 100%);color:#fff;box-shadow:0 4px 12px rgba(245,108,108,.4);transform:translateY(-1px);opacity:.9}
.btn-danger:active{transform:translateY(0)}
.btn-text{border:none;background:transparent;color:var(--blue);padding:4px 8px}
.btn-text:hover{background:transparent;color:var(--blue-d)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-lg{padding:10px 20px;font-size:14px}

/* ===== Global nav ===== */
#topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;padding:0 16px;height:48px;background:#fff;border-bottom:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.04)}
#topbar .brand{font-weight:600;font-size:15px;margin-right:8px;color:var(--blue)}
#topbar .brand small{font-weight:400;color:var(--text-3);font-size:12px;margin-left:6px}
#topbar .spacer{flex:1}
.view-tabs{display:flex;gap:2px;background:#f0f2f5;border-radius:6px;padding:2px}
.view-tabs button{border:none;background:transparent;padding:6px 12px;border-radius:4px;color:var(--text-2)}
.view-tabs button.active{background:#fff;color:var(--blue);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* ===== Stage layout ===== */
#stage{display:flex;gap:16px;padding:16px;align-items:flex-start}
.panel{background:#fff;border-radius:8px;box-shadow:var(--shadow);overflow:hidden;flex-shrink:0}
#admin-panel{width:1000px}
#student-panel{width:375px;border-radius:28px;border:8px solid #1f2937;box-shadow:var(--shadow-d)}
#teacher-panel{flex:1;min-width:0;max-width:1200px}
.hidden{display:none!important}
.center-wrap{display:flex;justify-content:center;padding:16px}
.page-title{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);background:#fafafa}
.page-title h2{font-size:15px;font-weight:600}
.page-title .pid{font-size:11px;color:#fff;background:var(--blue);padding:2px 8px;border-radius:10px;margin-right:8px}
#student-panel .page-title{background:#fff}
#student-panel .page-title .pid{background:var(--gold)}
#teacher-panel .page-title .pid{background:var(--blue)}

/* ===== Admin layout ===== */
.admin-body{display:flex;height:620px}
.admin-side{width:200px;background:#1a1a2e;border-right:none;padding:0 0 8px;overflow-y:auto;flex-shrink:0}
.admin-side .logo{height:60px;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:6px}
.admin-side .logo .ic{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
.admin-side .logo .tt{color:#fff;font-weight:700;font-size:15px}
.admin-side .nav-item{padding:11px 18px;cursor:pointer;color:#a0a0b8;font-size:13px;border-left:3px solid transparent}
.admin-side .nav-item .ni{display:inline-block;width:16px;margin-right:8px;opacity:.85}
.admin-side .nav-item .ni svg{width:16px;height:16px;display:inline-block;vertical-align:middle;fill:currentColor}
.admin-side .nav-item:hover{color:#fff;background:rgba(102,126,234,.12)}
.admin-side .nav-item.active{color:#fff;font-weight:600;background:linear-gradient(90deg,rgba(102,126,234,.3),transparent);border-left-color:#667eea}
.admin-side .nav-item .sub{display:block;font-size:10px;color:#6b6b85;margin-top:2px}
.admin-side .nav-item.active .sub{color:#a0a0b8}
/* 待新增页面:灰置入口 + 标注(严格复刻定位:真实项目不存在的页面不作为已存在能力展示) */
.admin-side .nav-item.nav-added{opacity:.5}
.admin-side .nav-item.nav-added .ni{filter:grayscale(1)}
.chip-added{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:8px;font-size:10px;line-height:1.5;background:rgba(255,244,224,.14);color:#d0a35c;border:1px solid rgba(208,163,92,.4);vertical-align:middle}
.pending-banner{display:flex;gap:8px;align-items:flex-start;background:#fff8ec;border:1px dashed #e0b070;color:#a9702a;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:12px;line-height:1.6}
.pending-banner .pb-ttl{font-weight:700;color:#b8792a;white-space:nowrap}
.admin-side .grp{padding:12px 18px 4px;font-size:11px;color:#6b6b85;letter-spacing:.5px}
.admin-main{flex:1;overflow:auto;padding:14px}
.admin-main .toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.admin-main .toolbar input,.admin-main .toolbar select{padding:6px 10px;border:1px solid var(--border-d);border-radius:4px;font-size:13px}
table.el{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border:1px solid #ebeef5;border-radius:8px;overflow:hidden}
table.el th{background:#f5f7fa;color:#303133;font-weight:600;text-align:left;padding:10px 8px;border-bottom:1px solid #ebeef5;white-space:nowrap}
table.el td{padding:10px 8px;border-bottom:1px solid #ebeef5;vertical-align:middle}
table.el tr:hover td{background:#f5f7fa}
table.el tbody tr:nth-child(even) td{background:#fafafa}
table.el tbody tr:nth-child(even):hover td{background:#f0f2f5}
.cell{padding:0 4px}
.muted{color:var(--text-3);font-size:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;background:#f0f2f5;color:var(--text-2)}
/* admin el-tag 颜色(对齐 Element Plus tag type: primary/success/warning/info/danger) */
.tag-primary{background:#ecf5ff;color:#409eff;border:1px solid #b3d8ff}
.tag-success{background:#f0f9eb;color:#67c23a;border:1px solid #c2e7b0}
.tag-warning{background:#fdf6ec;color:#e6a23c;border:1px solid #f5dab1}
.tag-info{background:#f4f4f5;color:#909399;border:1px solid #e9e9eb}
.tag-danger{background:#fef0f0;color:#f56c6c;border:1px solid #fbc4c4}

/* ===== Badges ===== */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:10px;font-size:12px;line-height:1.6;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-gray{background:#f4f4f5;color:#909399}
.st-green{background:#f0f9eb;color:#67c23a}
.st-blue{background:#ecf5ff;color:#409eff}
.st-orange{background:#fdf6ec;color:#e6a23c}
.st-red{background:#fef0f0;color:#f56c6c}
/* miniapp 卡状态徽标:圆点+浅底+文字(严格对齐真实 .card-status-badge) */
.card-status-badge{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:12px;font-size:11px;line-height:1.7;white-space:nowrap}
.card-status-badge .badge-dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
.card-status-badge .badge-text{font-weight:500}
.mst-active{background:rgba(76,175,80,.12);color:#2e7d32}
.mst-usedup{background:rgba(158,158,158,.1);color:#757575}
.mst-pending{background:rgba(255,183,77,.15);color:#e65100}
.mst-expired{background:rgba(244,67,54,.1);color:#c62828}
.mst-voided{background:rgba(158,158,158,.1);color:#757575}
.mst-frozen{background:rgba(100,149,237,.12);color:#4a7bd4}

/* ===== Sticky note (decision placeholder) ===== */
.sticky{background:#fffbe6;border:1px solid #ffe58f;border-left:4px solid #faad14;border-radius:4px;padding:8px 10px;font-size:12px;color:#86592b;margin:8px 0;line-height:1.6}
.sticky b{color:#d48806;background:#fff7d6;padding:0 6px;border-radius:3px;margin-right:6px}
.sticky .dnum{font-size:10px;color:#d48806;font-weight:700}

/* ===== Empty / error ===== */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 16px;text-align:center;color:var(--text-3)}
.empty .ico{font-size:40px;margin-bottom:10px}
.empty.err .ico{color:var(--red)}
.empty p{margin-bottom:12px;max-width:280px}

/* ===== Modal ===== */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:100;align-items:center;justify-content:center;padding:20px}
.modal-mask.show{display:flex}
.modal{background:#fff;border-radius:8px;width:480px;max-width:92vw;max-height:88vh;display:flex;flex-direction:column;box-shadow:var(--shadow-d)}
.modal.wide{width:640px}
.modal .m-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)}
.modal .m-head h3{font-size:16px}
.modal .m-body{padding:18px;overflow:auto}
.modal .m-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:13px;color:var(--text-2);margin-bottom:6px}
.form-row label .req{color:var(--red)}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:8px 10px;border:1px solid var(--border-d);border-radius:4px;font-size:13px;font-family:inherit}
.form-row .hint{font-size:12px;color:var(--text-3);margin-top:4px}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.confirm-box{background:#f5f7fa;border-radius:6px;padding:12px;margin:8px 0}
.confirm-box .row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
.confirm-box .row .k{color:var(--text-3)}
/* ===== Admin 详情弹窗 el-descriptions 风格网格(原型自建 .desc-grid) ===== */
.desc-grid{display:grid;grid-template-columns:1fr 1fr;border:1px solid #ebeef5;border-radius:6px;overflow:hidden;margin:8px 0 4px}
.desc-grid .dg-item{display:flex;border-bottom:1px solid #ebeef5;border-right:1px solid #ebeef5;min-height:38px}
.desc-grid .dg-item.span2{grid-column:span 2}
.desc-grid .dg-k{background:#fafafa;color:#909399;padding:9px 12px;font-size:13px;width:110px;flex-shrink:0;border-right:1px solid #ebeef5;box-sizing:border-box}
.desc-grid .dg-v{padding:9px 12px;font-size:13px;color:#303133;flex:1;word-break:break-all}
/* ===== 筛选栏(独立一行) + 状态多选(复刻真实 el-select multiple) ===== */
.filter-row{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.filter-row input{padding:6px 10px;border:1px solid var(--border-d);border-radius:4px;font-size:13px}
.ms-select{display:inline-flex;gap:6px;align-items:center;padding:4px 8px;border:1px solid var(--border-d);border-radius:4px;background:#fff}
.ms-opt{font-size:12px;padding:3px 10px;border-radius:12px;background:#f4f4f5;color:#606266;cursor:pointer;user-select:none}
.ms-opt.on{background:#ecf5ff;color:#409eff;border:1px solid #b3d8ff}
.chk-line{margin:6px 0;font-size:13px;color:#606266}
.chk-line label{display:flex;align-items:center;gap:6px;cursor:pointer}
/* ===== 绿色"已确认"便签(结构对齐 sticky,语义=已确认决策) ===== */
.cnote{background:#f0f9eb;border:1px solid #c2e7b0;border-left:4px solid #67c23a;border-radius:4px;padding:8px 10px;font-size:12px;color:#4e7a35;margin:8px 0;line-height:1.6}
.cnote b{color:#3d6b26;background:#e7f5d8;padding:0 6px;border-radius:3px;margin-right:6px}
.cnote .dnum{font-size:10px;color:#3d6b26;font-weight:700}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 18px;border-radius:6px;z-index:200;font-size:13px;box-shadow:var(--shadow-d);display:none}
.toast.show{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;top:40px}to{opacity:1;top:60px}}

/* ===== Student mini-app ===== */
.stu-frame{position:relative;display:flex;flex-direction:column;height:680px;background:linear-gradient(180deg,#faf6f0 0%,#f5ede3 100%)}
.stu-statusbar{height:24px;background:#1f2937;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:space-between;padding:0 14px}
.stu-statusbar .right{display:flex;gap:4px;align-items:center}
.stu-content{flex:1;overflow-y:auto;padding:12px}
/* ---- 底部导航:严格复刻 components/HomeTabBar.vue(rpx→px ×0.5) ----
   .tab-bar(padding 12rpx 0 28rpx/border-top 1rpx #f5f5f5/shadow 0 -2rpx 12rpx rgba(0,0,0,.04))
   .tab-item(flex:1/column/center/padding 8rpx 0) + AppIcon size 48rpx
   .tab-text(22rpx #999/激活 #8b7355 font-weight 500) + .tab-indicator(40rpx×4rpx 渐变) */
.stu-tabbar{background:#fff;padding:6px 0 14px;border-top:.5px solid #f5f5f5;box-shadow:0 -1px 6px rgba(0,0,0,.04);display:flex}
.stu-tabbar.hidden{display:none}
.stu-tabbar .tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:4px 0;cursor:pointer}
.stu-tabbar .tab-item .tab-ic{width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.stu-tabbar .tab-item .tab-ic svg{width:24px;height:24px;display:block}
.stu-tabbar .tab-text{font-size:11px;color:#999;margin-top:3px;transition:color .3s ease}
.stu-tabbar .tab-text.active{color:#8b7355;font-weight:500}
.stu-tabbar .tab-indicator{position:absolute;bottom:0;width:20px;height:2px;background:linear-gradient(90deg,#c9a66b,#d9a7b0);border-radius:1px}
/* 返回条:模拟小程序 native 导航栏返回按钮(真实 pushed 页由系统导航栏提供) */
.stu-backbar{display:flex;align-items:center;gap:4px;padding:2px 0 10px;font-size:13px;color:#8b7355;cursor:pointer}
/* ===== AI 助手页(一级 Tab) —— 沿用学员端香槟金主题,与首页/排期/我的保持同一设计系统 ===== */
/* .ai-mode: 内容区去内边距并禁止外层滚动,交由聊天页内部两段式布局(对话区滚动 + 输入区固定) */
.stu-content.ai-mode{padding:0;overflow:hidden;display:flex;flex-direction:column}
.ai-page{flex:1;min-height:0;display:flex;flex-direction:column;background:linear-gradient(180deg,#faf6f0 0%,#f5ede3 100%)}
/* 顶部区域:标题 + 简洁会话状态(不占过多垂直空间) */
.ai-header{display:flex;align-items:center;gap:8px;padding:9px 14px;background:#fff;border-bottom:.5px solid #f2ece4;flex-shrink:0}
.ai-header .ai-hic{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#d4b896,#c9a66b);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ai-header .ai-hic svg{width:18px;height:18px}
.ai-header .ai-htxt{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.ai-header .ai-hname{font-size:14px;font-weight:600;color:#3a2c1e}
.ai-header .ai-hsub{font-size:10px;color:#b8a088;display:flex;align-items:center;gap:4px;white-space:nowrap}
.ai-header .ai-dot{width:6px;height:6px;border-radius:50%;background:#7bbf8a;display:inline-block;flex-shrink:0}
.ai-header .ai-clear{margin-left:auto;display:inline-flex;align-items:center;gap:3px;font-size:11px;color:#8b7355;border:.5px solid #e6dccd;border-radius:999px;padding:3px 10px;cursor:pointer;flex-shrink:0}
/* 对话区域:占据主要可用空间,独立滚动 */
.ai-msgs{flex:1;min-height:0;overflow-y:auto;padding:12px 12px 6px;display:flex;flex-direction:column;gap:10px}
.ai-welcome{display:flex;flex-direction:column;align-items:center;padding:10px 2px 4px}
.ai-welcome .ai-wbadge{display:inline-flex;align-items:center;gap:6px;background:rgba(201,166,107,.14);color:#8b7355;font-size:11px;padding:5px 12px;border-radius:999px}
.ai-welcome .ai-wic{width:14px;height:14px;display:flex;align-items:center;justify-content:center}
.ai-welcome .ai-wic svg{width:14px;height:14px}
.ai-quick{display:flex;flex-direction:column;gap:8px;margin-top:12px;width:100%}
.ai-qcard{display:flex;align-items:center;gap:10px;background:#fff;border:.5px solid #efe6d8;border-radius:10px;padding:10px 12px;box-shadow:0 1px 4px rgba(0,0,0,.04);cursor:pointer;text-align:left}
.ai-qcard:active{transform:scale(.99)}
.ai-qcard .ai-qic{width:26px;height:26px;border-radius:8px;background:rgba(201,166,107,.16);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ai-qcard .ai-qic svg{width:15px;height:15px}
.ai-qcard .ai-qtext{font-size:12px;color:#5a4a38}
.ai-qcard .ai-qarrow{margin-left:auto;color:#c9a66b;font-size:14px;line-height:1}
/* 消息:用户/AI 区分展示 */
.ai-msg{display:flex;gap:8px;align-items:flex-start;width:100%}
.ai-msg.user{justify-content:flex-end}
.ai-msg .ai-av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#d4b896,#c9a66b);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ai-msg .ai-av svg{width:16px;height:16px}
.ai-bubble{max-width:76%;padding:9px 12px;font-size:12px;line-height:1.6;color:#3a2c1e;background:#fff;border-radius:4px 12px 12px 12px;box-shadow:0 1px 4px rgba(0,0,0,.05);white-space:pre-wrap;word-break:break-word}
.ai-msg.user .ai-bubble{background:linear-gradient(135deg,#d4b896,#c9a66b);color:#fff;border-radius:12px 4px 12px 12px}
.ai-bubble.err{background:#fdf1f0;color:#c0392b;border:.5px solid #f3d6d3}
.ai-bubble .ai-dots{display:flex;gap:4px;padding:3px 0}
.ai-bubble .ai-dots .dt{width:6px;height:6px;border-radius:50%;background:#c9a66b;animation:aiDot 1.4s ease-in-out infinite}
.ai-bubble .ai-dots .dt:nth-child(2){animation-delay:.2s}
.ai-bubble .ai-dots .dt:nth-child(3){animation-delay:.4s}
@keyframes aiDot{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
/* 底部输入区:固定在页面底部(TabBar 之上),预留安全区间距,不遮挡消息与导航 */
.ai-input-area{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:8px 12px 12px;background:#fff;border-top:.5px solid #f2ece4}
.ai-input-wrap{flex:1;display:flex;align-items:center;background:#faf7f2;border:.5px solid #eee3d5;border-radius:999px;padding:0 12px;gap:6px;min-width:0}

.filter-tabs{display:flex;gap:8px;padding:2px 0 12px}

.card-item{background:#fff;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.05);margin-bottom:12px;border:1px solid rgba(201,166,107,.14);overflow:hidden}
.card-item.card-active{background:linear-gradient(135deg,#fdf6e9 0%,#f9edda 30%,#f5e6c8 60%,#f0d9a8 100%);border-color:rgba(201,166,107,.2);box-shadow:0 2px 12px rgba(201,166,107,.2)}
.card-item.card-pending,.card-item.card-used-up{background:linear-gradient(135deg,#faf8f5 0%,#f7f3ed 100%)}
.card-item.card-frozen{background:linear-gradient(135deg,#f5f7fa 0%,#eef1f5 100%)}
.card-item.card-expired,.card-item.card-voided{background:linear-gradient(135deg,#f8f6f3 0%,#f3f0eb 100%);opacity:.65}
.card-content{padding:14px}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card-name{font-size:15px;font-weight:700;color:#333}

.copy-icon-btn{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:4px;background:rgba(201,166,107,.14);color:#b8956a;font-size:10px;line-height:1;cursor:pointer;flex-shrink:0}

.card-usage{display:flex;align-items:flex-end;justify-content:space-between;margin-top:12px;gap:10px}

.usage-main{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.credits-display{display:flex;align-items:baseline;gap:1px}
.credits-label{font-size:12px;color:#8a7a6a;margin-right:2px}
.credits-remaining{font-size:26px;font-weight:700;color:#c9a66b;line-height:1.1}
.credits-remaining.zero{color:#ef5350}
.credits-separator{font-size:14px;color:#c0b6a6;margin:0 1px}
.credits-total{font-size:14px;color:#999}
.credits-unit{font-size:12px;color:#999;margin-left:2px}
.usage-unlimited-text{font-size:15px;font-weight:600;color:#c9a66b;margin-left:2px}
.usage-divider-line{width:1px;height:24px;background:rgba(201,166,107,.28);flex-shrink:0}
.usage-valid-range{font-size:11px;color:#8a7a6a;text-align:right;white-space:nowrap}
.usage-valid-range .vr-k{display:block;font-size:10px;color:#a89b8a}
.usage-with-activate{justify-content:space-between}
.activate-btn-inline{flex-shrink:0;padding:7px 16px;border-radius:20px;font-size:12px;font-weight:600;color:#fff;background:linear-gradient(135deg,#d4b896 0%,#c9a66b 100%);border:none;box-shadow:0 4px 16px rgba(201,166,107,.3)}

.warning-title{font-size:12px;font-weight:600;color:#e65100}
.warning-desc{font-size:11px;color:#a06a2c;line-height:1.5;margin-top:2px}
/* 空状态:3D 插画 + 权益四宫格 */
.empty-state{display:flex;flex-direction:column;align-items:center;padding:22px 12px 8px;text-align:center}
.empty-card-illustration{position:relative;width:132px;height:96px;margin-bottom:14px}
.card-3d{position:relative;width:106px;height:68px;margin:10px auto 0;border-radius:10px;background:linear-gradient(135deg,#f3d9a4 0%,#e2c184 55%,#c9a66b 100%);box-shadow:0 10px 22px rgba(201,166,107,.35);display:flex;align-items:center;justify-content:center;transform:rotate(-8deg)}
.card-3d.invalid{background:linear-gradient(135deg,#f0ebe3 0%,#e8e0d5 55%,#ddd5c8 100%);box-shadow:0 10px 22px rgba(184,160,136,.2)}

.card-shadow{position:absolute;left:14px;right:14px;bottom:2px;height:10px;border-radius:50%;background:rgba(201,166,107,.22);filter:blur(2px)}

.sparkles span{position:absolute;color:#d9b979;font-size:12px}
.sparkles span:nth-child(1){left:4px;top:6px}
.sparkles span:nth-child(2){right:2px;top:14px;font-size:15px}
.sparkles span:nth-child(3){left:12px;bottom:12px;font-size:14px}
.empty-title{font-size:15px;font-weight:600;color:#5a4a3a}
.empty-desc{font-size:12px;color:#a89b8a;margin-top:6px}

.go-handle-btn .btn-arrow{opacity:.85}
.benefits-section{margin-top:22px;width:100%}
.benefits-title{font-size:12px;color:#a89b8a;margin-bottom:10px}
.benefits-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.benefit-item{background:rgba(255,255,255,.8);border:1px solid rgba(201,166,107,.16);border-radius:10px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.benefit-item .bi{font-size:18px}
.benefit-text{font-size:12px;color:#8a7a6a}

.info-card,.use-card-card,.notice-card{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.05);margin-bottom:12px;padding:14px}

.card-option-remaining{font-size:11px;color:#8a7a6a;margin-top:3px}
.card-option-applicable{font-size:11px;color:#a89b8a;margin-top:2px}

.no-available-cards{text-align:center;padding:26px 0;color:#a89b8a;font-size:13px}

.m3-navbar{background:#fff;border-radius:12px;padding:10px 14px;margin-bottom:10px;font-size:15px;font-weight:600;color:#1a1a1a;box-shadow:0 1px 4px rgba(0,0,0,.04)}

.filter-pill.pill-active{background:linear-gradient(135deg,#e8d5b7 0%,#d4b896 100%);color:#5c4a32;border-color:transparent;font-weight:600;box-shadow:0 2px 8px rgba(201,166,107,.3)}

.pill-day-name{font-size:10px;color:#8E8579;margin-bottom:1px}
.pill-day-date{font-size:12px;color:#1A1A1A;font-weight:500}
.date-pill.pill-active .pill-day-name,.date-pill.pill-active .pill-day-date{color:#fff}

.schedule-top{display:flex;align-items:center;gap:6px;margin-bottom:8px}

.course-type-tag.tag-special{background:linear-gradient(135deg,rgba(180,220,200,.4) 0%,rgba(160,200,180,.2) 100%);color:#5b8a7b}

.schedule-info .ii-ic{color:#b8a088;width:14px;text-align:center;flex-shrink:0}
.schedule-footer{display:flex;align-items:center;justify-content:space-between}
.capacity-info{display:flex;align-items:center;gap:4px}
.capacity-info .ii-ic{color:#b8a088}
.capacity-text{font-size:12px;color:#a89880}
.btn-wrapper{display:flex;flex-direction:column;align-items:flex-end;gap:3px}

.cancel-hint{font-size:10px;color:#c9a66b;line-height:1.2}
.stu-h1{font-size:16px;font-weight:600;padding:4px 0 10px;color:#5a4a3a}
.stu-section{font-size:13px;color:#8a7a6a;margin:14px 4px 8px;font-weight:500}
.stu-link{display:block;text-align:center;color:var(--gold);padding:10px}
.stu-list-item{background:#fff;border-radius:8px;padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.05)}

/* expected validity for a period card given a schedule date (D9) */
function expectedRange(card,schedDate){return {from:schedDate,to:addDays(schedDate,card.validity_days)}}
function overlap(a,b){return a.from<=b.to&&b.from<=a.to} // inclusive
/* does this card conflict with another ACTIVE/PENDING period card of same product on given schedDate? */
function cardConflict(card,schedDate){
  if(card.type!=='period')return false;
  const er=expectedRange(card,schedDate);
  for(const o of CARDS){
    if(o.id===card.id)continue;
    if(o.studentId!==card.studentId)continue;
    if(o.productId!==card.productId)continue;
    if(!['ACTIVE','PENDING'].includes(o.status))continue;
    let or;
    if(o.status==='PENDING'&&o.valid_from==null){
      // PENDING 期卡尚未有预约则无确定区间；冲突演示态下视为有一张已生效重叠卡
      continue;
    }
    or={from:o.valid_from,to:o.expire_at};
    if(overlap(er,or))return o;
  }
  return false;
}

/* 跨排期时间段重叠校验(原型演示态,2026-10-19 补)
   口径:当前学员「进行中」预约(BOOKED/CHECKED_IN,不含 CANCELLED/COMPLETED)所在排期时间段,
   与目标排期时间段做标准区间重叠判断 a.start < b.end && b.start < a.end。
   时间粒度:排期=日期(date,'YYYY-MM-DD')+时段(time,'HH:MM-HH:MM');拼接为 'YYYY-MM-DDTHH:MM' 字符串,
   该格式字典序即为时间序,直接字符串比较,不受本地时区影响。
   与上方「会员卡有效期重叠」(cardConflict)相互独立,互不覆盖。
   真实后端 apps/api/src/app/modules/booking/service.py::create_booking 尚无此校验,见 open-decisions.md。 */
function slotRange(date,time){const p=time.split('-');return {start:date+'T'+p[0],end:date+'T'+p[1]}}
function scheduleTimeConflict(schedule){
  if(!schedule)return null;
  const tgt=slotRange(schedule.date,schedule.time);
  for(const b of BOOKINGS){
    if(b.studentId!=='U1')continue;
    if(['BOOKED','CHECKED_IN'].indexOf(b.status)<0)continue;
    if(b.scheduleId===schedule.id)continue; /* 同排期重复预约由 P-M3 schedView 拦截,此处只管跨排期 */
    const ex=slotRange(b.date,b.time);
    if(tgt.start<ex.end&&ex.start<tgt.end)return b;
  }
  return null;
}

function closeModal(){document.getElementById('mask').classList.remove('show')}

/* ============ VIEW ============ */
function setView(v){
  STATE.view=v;
  document.getElementById('vt-dual').classList.toggle('active',v==='dual');
  document.getElementById('vt-admin').classList.toggle('active',v==='admin');
  document.getElementById('vt-student').classList.toggle('active',v==='student');
  document.getElementById('vt-teacher').classList.toggle('active',v==='teacher');
  const a=document.getElementById('admin-panel'),s=document.getElementById('student-panel'),t=document.getElementById('teacher-panel');
  const stage=document.getElementById('stage');
  a.classList.remove('hidden');s.classList.remove('hidden');t.classList.add('hidden');
  stage.classList.remove('center-wrap');
  if(v==='dual'){a.classList.remove('hidden');s.classList.remove('hidden')}
  else if(v==='admin'){s.classList.add('hidden');stage.classList.add('center-wrap')}
  else if(v==='student'){a.classList.add('hidden');stage.classList.add('center-wrap')}
  else if(v==='teacher'){a.classList.add('hidden');s.classList.add('hidden');t.classList.remove('hidden');renderTeacher()}
}

/* ============ RENDER ALL ============ */
function renderAll(){renderAdminSide();renderAdminPage();renderStuPage();if(STATE.view==='teacher')renderTeacher()}

/* ---------- P-A1 卡产品管理(对齐 admin-web/views/card-types/index.vue) ---------- */
function adminA1(){
  const sel=STATE.selProducts||[];
  const empty=`<tr><td colspan="10" style="text-align:center;color:#909399">暂无数据</td></tr>`;
  let rows=PRODUCTS.map((p,i)=>{
    const code=p.type==='credits'?'count':p.type;   /* 真实 card_type: count=次卡 period=期卡 unlimited=无限卡 */
    const isCount=code==='count',isPeriod=code==='period';
    return `<tr>
    <td><input type="checkbox" ${sel.includes(p.id)?'checked':''} onclick="toggleProductSel('${p.id}')"></td>
    <td>${i+1}</td>
    <td>${p.name}</td>
    <td>${ctTagProduct(code)}</td>
    <td>${isCount?(p.credits==null?'-':p.credits):'-'}</td>
    <td>${(isCount||isPeriod)?p.validity_days:'-'}</td>
    <td>${p.price}</td>
    <td>${courseTypeTag(p.applicable_course_type_code)}</td>
    <td>${p.status==='上架'?'<span class="tag tag-success">上架</span>':'<span class="tag tag-info">下架</span>'}</td>
    <td>
      <button class="btn-text btn-sm" onclick="openProductModal('${p.id}')">编辑</button>
      <button class="btn-text btn-sm" style="color:${p.status==='上架'?'#e6a23c':'#67c23a'}" onclick="adminToggleProduct('${p.id}')">${p.status==='上架'?'下架':'上架'}</button>
      ${p.status==='下架'?`<button class="btn-text btn-sm" style="color:#f56c6c" onclick="adminDeleteProduct('${p.id}')">删除</button>`:''}
    </td>
  </tr>`;
  }).join('');
  return `<div class="toolbar">
    <button class="btn-primary btn-sm" onclick="openProductModal()">新增</button>
    <button class="btn-danger btn-sm" ${sel.length?'':'disabled style="opacity:.5"'} onclick="openBatchDeleteProducts()">批量删除</button>
    <span class="muted">产品=模板,卡=实例 (R-B1)</span>
  </div>
  <div class="scroll-x"><table class="el"><thead><tr><th style="width:40px"><input type="checkbox" onclick="toggleAllProductSel()"></th><th>序号</th><th>产品名称</th><th>计费方式</th><th>包含次数</th><th>有效天数</th><th>价格(元)</th><th>适用课程类型</th><th>状态</th><th>操作</th></tr></thead><tbody>${rows.length?rows:empty}</tbody></table></div>
  ${sticky(2,'次卡用尽是否独立状态:现状无 EXHAUSTED,remaining=0 仍 ACTIVE,"已用尽"仅以余额徽标表达(本原型采用)')}
  <div class="muted" style="margin-top:8px">软删除+回收站恢复为原型扩展(真实页面无回收站按钮,listDeleted 未接入);删除后新建同名产品不冲突</div>`;
}
/* 新建/编辑卡产品弹窗(对齐真实: 产品名称/计费方式(仅次卡·期卡)/包含次数/有效天数/价格/适用课程类型/描述) */
function openProductModal(id){
  const p=id?PRODUCTS.find(x=>x.id===id):{id:'P'+(PRODUCTS.length+1),name:'',type:'credits',price:'',credits:'',validity_days:'',applicable_course_type_code:'regular',description:''};
  const ctOpts=`<option value="credits" ${p.type==='credits'?'selected':''}>次卡</option><option value="period" ${p.type==='period'?'selected':''}>期卡</option>`;
  const ctTypeOpts=['regular','private','special'].map(c=>`<option value="${c}" ${p.applicable_course_type_code===c?'selected':''}>${courseTypeName(c)}</option>`).join('');
  openModal(`<div class="m-head"><h3>${id?'编辑':'新增'} <span class="muted">P-A1</span></h3><button class="btn-text" onclick="closeModal()">✕</button></div>
  <div class="m-body">
    <div class="form-row"><label>产品名称 <span class="req">*</span></label><input value="${p.name}" placeholder="请输入产品名称"></div>
    <div class="form-row"><label>计费方式 <span class="req">*</span></label><select id="pm-type" onchange="productModalTypeChange()">${ctOpts}</select></div>
    <div class="form-row" id="pm-credits-row" style="display:${p.type==='credits'?'':'none'}"><label>包含次数 <span class="req">*</span></label><input type="number" min="1" value="${p.credits==null?'':p.credits}"></div>
    <div class="form-row" id="pm-days-row"><label>有效天数 <span class="req">*</span></label><input type="number" min="1" value="${p.validity_days==null?'':p.validity_days}"></div>
    <div class="form-row"><label>价格(元) <span class="req">*</span></label><input type="number" min="0" step="0.01" value="${p.price}"></div>
    <div class="form-row"><label>适用课程类型 <span class="req">*</span></label><select id="pm-ctcode">${ctTypeOpts}</select><div class="hint">必填项：选择后学员只能预约该课程类型的课程，请根据产品定位选择</div></div>
    <div class="form-row"><label>描述</label><textarea rows="3" placeholder="请输入描述">${p.description||''}</textarea></div>
  </div>
  <div class="m-foot"><button onclick="closeModal()">取消</button><button class="btn-primary" onclick="closeModal();toast('已保存(演示)')">确定</button></div>`);
}
/* 计费方式切换:次卡显示"包含次数"(无限卡隐藏"有效天数") */
function productModalTypeChange(){
  const tEl=document.getElementById('pm-type');const t=tEl?tEl.value:'credits';
  const cr=document.getElementById('pm-credits-row'),dr=document.getElementById('pm-days-row');
  if(cr&&cr.style)cr.style.display=(t==='credits')?'':'none';
  if(dr&&dr.style)dr.style.display=(t==='unlimited')?'none':'';
}
function toggleProductSel(id){const s=STATE.selProducts||(STATE.selProducts=[]);const i=s.indexOf(id);if(i>=0)s.splice(i,1);else s.push(id);renderAdminPage()}
function toggleAllProductSel(){const all=PRODUCTS.map(p=>p.id);STATE.selProducts=((STATE.selProducts||[]).length===all.length)?[]:all.slice();renderAdminPage()}
function adminToggleProduct(id){const p=PRODUCTS.find(x=>x.id===id);if(!p)return;const act=p.status==='上架'?'下架':'上架';openModal(confirmBox('提示',`确定要${act}卡类型「${p.name}」吗？`,'',act,`adminToggleProductDo('${id}')`))}
function adminToggleProductDo(id){const p=PRODUCTS.find(x=>x.id===id);p.status=p.status==='上架'?'下架':'上架';closeModal();toast('操作成功');renderAdminPage()}
function adminDeleteProduct(id){const p=PRODUCTS.find(x=>x.id===id);openModal(confirmBox('警告',`确定要删除卡类型「${p.name}」吗？`,'删除后移入回收站(软删除,原型扩展)','删除',`adminDeleteProductDo('${id}')`))}
function adminDeleteProductDo(id){PRODUCTS=PRODUCTS.filter(p=>p.id!==id);STATE.selProducts=(STATE.selProducts||[]).filter(x=>x!==id);closeModal();toast('删除成功');renderAdminPage()}
/* 批量删除弹窗(对齐真实: 标题/确定文案/仅已下架可删提示) */
function openBatchDeleteProducts(){
  const sel=(STATE.selProducts||[]).map(id=>PRODUCTS.find(p=>p.id===id)).filter(Boolean);
  if(!sel.length){toast('请先勾选要删除的卡类型');return}
  const notOff=sel.filter(p=>p.status!=='下架');
  if(notOff.length){toast('以下卡类型未下架,无法删除:'+notOff.map(p=>p.name).join('、')+'.请先下架后再删除');return}
  openModal(`<div class="m-head"><h3>批量删除 <span class="muted">P-A1</span></h3><button class="btn-text" onclick="closeModal()">✕</button></div>
  <div class="m-body">
    <p style="margin-bottom:12px">确定要删除以下 <strong style="color:#f56c6c;font-size:16px">${sel.length}</strong> 个卡类型吗？</p>
    <ul style="padding-left:20px;color:#606266;line-height:1.9">${sel.map(p=>`<li>${p.name}（${ctText(p.type==='credits'?'count':p.type)}）</li>`).join('')}</ul>
    <p style="margin-top:12px;color:#f56c6c;font-size:13px">注意：只有已下架的卡类型才能删除，删除后将移入回收站。</p>
  </div>
  <div class="m-foot"><button onclick="closeModal()">取消</button><button class="btn-primary" onclick="doBatchDeleteProducts()">确定</button></div>`);
}
function doBatchDeleteProducts(){const sel=STATE.selProducts||[];PRODUCTS=PRODUCTS.filter(p=>sel.indexOf(p.id)<0);STATE.selProducts=[];closeModal();toast('批量删除成功(演示)');renderAdminPage()}

/* ---------- P-A2 会员卡管理(对齐 admin-web/views/membership/index.vue) ---------- */
const ADMIN_ST_OPTS=[{v:'0',t:'未激活',s:'PENDING'},{v:'1',t:'正常',s:'ACTIVE'},{v:'2',t:'已过期',s:'EXPIRED'},{v:'3',t:'已冻结',s:'FROZEN'},{v:'6',t:'已作废',s:'CANCELLED'}];
const S2C={PENDING:'0',ACTIVE:'1',EXPIRED:'2',FROZEN:'3',CANCELLED:'6'};
function cardSelectable(c){return c.status!=='CANCELLED'&&c.status!=='EXPIRED'}
function adminA2(){
  const sel=STATE.selCards||[];const filt=STATE.cardStatusFilter||[];
  const list=CARDS.filter(c=>!filt.length||filt.includes(S2C[c.status]));
  const hasFrozen=CARDS.some(c=>c.status==='FROZEN');
  const selectable=list.filter(cardSelectable);
  const allSel=selectable.length>0&&selectable.every(c=>sel.includes(c.id));
  const empty=`<tr><td colspan="${hasFrozen?14:13}" style="text-align:center;color:#909399">暂无数据</td></tr>`;
  let rows=list.map((c,i)=>{
    const isCount=c.card_type==='count';
    const vrange=(c.valid_from&&c.expire_at)?`${c.valid_from} ~ ${c.expire_at}`:'-';
    const fStock=`<td>${c.status==='FROZEN'?`<div style="color:${frozenRemainDays(c)<=0?'#e6a23c':'#67c23a'};font-size:13px;font-weight:500">剩余 ${frozenRemainDays(c)} 天解冻</div>${adminHasConflict(c)?`<div style="margin-top:4px"><span class="tag tag-warning">⚠ 冻结到期-课程冲突</span></div>`:''}`:'-'}</td>`;
    return `<tr>
    <td><input type="checkbox" ${sel.includes(c.id)?'checked':''} ${cardSelectable(c)?`onclick="toggleCardSel('${c.id}')"`:'disabled style="opacity:.4"'}></td>
    <td>${i+1}</td>
    <td>${c.card_no?`<a class="link" style="color:#409eff;cursor:pointer" onclick="openCardDetail('${c.id}')">${c.card_no}</a>`:'-'}</td>
    <td>${c.product_name}</td>
    <td>${ctTagCard(c.card_type)}</td>
    <td>${c.student}</td>
    <td>${c.student_phone||'-'}</td>
    <td>${isCount?(c.total_credits==null?'-':c.total_credits):'-'}</td>
    <td>${isCount?(c.used_credits==null?0:c.used_credits):'-'}</td>
    <td>${isCount?(c.remaining_credits==null?'-':c.remaining_credits):'-'}</td>
    <td>${adminCardBadge(c)}</td>
    <td>${vrange}</td>
    ${hasFrozen?fStock:''}
    <td>
      ${c.status==='PENDING'?`<button class="btn-text btn-sm" style="color:#67c23a" onclick="adminActivate('${c.id}')">激活</button>`:''}
      ${c.status==='ACTIVE'?`<button class="btn-text btn-sm" style="color:#e6a23c" onclick="openFreezeModal('${c.id}')">冻结</button>`:''}
      ${c.status==='FROZEN'?`<button class="btn-text btn-sm" style="color:#67c23a" onclick="adminUnfreeze('${c.id}')">${adminHasConflict(c)?'强制解冻':'提前解冻'}</button>`:''}
      ${(c.status!=='CANCELLED'&&c.status!=='EXPIRED')?`<button class="btn-text btn-sm" style="color:#f56c6c" onclick="adminCancel('${c.id}')">作废</button>`:''}
    </td>
  </tr>`;
  }).join('');
  const stChips=ADMIN_ST_OPTS.map(o=>`<span class="ms-opt ${filt.includes(o.v)?'on':''}" onclick="toggleCardStatusFilter('${o.v}')">${o.t}</span>`).join('');
  return `<div class="toolbar">
    <button class="btn-primary btn-sm" onclick="openIssueModal()">发放会员卡 (P-A3)</button>
    <button class="btn-danger btn-sm" ${sel.length?'':'disabled style="opacity:.5"'} onclick="openBatchCancelCards()">批量作废</button>
    <span class="muted">D9: 期卡发卡即 PENDING,有效期待首次上课激活</span>
  </div>
  <div class="filter-row">
    <input id="card-search" placeholder="搜索学员或手机号" style="width:240px">
    <div class="ms-select"><span class="muted">状态筛选</span>${stChips}</div>
  </div>
  <div class="scroll-x"><table class="el"><thead><tr>
    <th style="width:40px"><input type="checkbox" ${allSel?'checked':''} onclick="toggleAllCardSel()"></th><th>序号</th><th>会员卡号</th><th>产品名称</th><th>计费方式</th><th>学员</th><th>手机号</th><th>总次数</th><th>已用</th><th>剩余</th><th>状态</th><th>有效期</th>${hasFrozen?'<th>冻结信息</th>':''}<th>操作</th>
  </tr></thead><tbody>${rows.length?rows:empty}</tbody></table></div>
  ${confirmedNote(3,'冻结/作废前应显示"该卡 N 个有效预约受影响"(依赖待开发的受影响预约查询);此处为占位')}
  <div class="muted" style="margin-top:8px">流程 A 入口:点击下方"演示流程 A"可跳转学员端查看课卡</div>`;
}
function toggleCardSel(id){const s=STATE.selCards||(STATE.selCards=[]);const i=s.indexOf(id);if(i>=0)s.splice(i,1);else s.push(id);renderAdminPage()}
function toggleAllCardSel(){const ids=CARDS.filter(cardSelectable).map(c=>c.id);STATE.selCards=((STATE.selCards||[]).length===ids.length)?[]:ids.slice();renderAdminPage()}
function toggleCardStatusFilter(v){const s=STATE.cardStatusFilter||(STATE.cardStatusFilter=[]);const i=s.indexOf(v);if(i>=0)s.splice(i,1);else s.push(v);renderAdminPage()}
function adminActivate(id){const c=cardById(id);c.status='ACTIVE';c.valid_from=c.valid_from||TODAY;c.expire_at=c.expire_at||addDays(TODAY,c.validity_days);c.updated_at=TODAY+' 10:00:00';toast('激活成功');renderAdminPage();renderStuPage()}
/* 冻结弹窗(对齐真实: 冻结天数 1-365 默认7 + 冻结原因 textarea) */
function openFreezeModal(id){

  <div class="m-body">
    <div class="form-row"><label>冻结天数 <span class="req">*</span></label><input id="fz-days" type="number" min="1" max="365" value="7"><span class="hint" style="margin-top:6px">1-365天</span></div>
    <div class="form-row"><label>冻结原因 <span class="req">*</span></label><textarea id="fz-reason" rows="3" placeholder="请输入冻结原因"></textarea></div>

function adminFreezeConfirm(id){const c=cardById(id);const dEl=document.getElementById('fz-days');const rEl=document.getElementById('fz-reason');const days=parseInt((dEl?dEl.value:'')||'7',10);const reason=(rEl?rEl.value:'').trim();if(!reason){toast('请输入冻结原因');return}if(!(days>=1&&days<=365)){toast('冻结天数需在 1-365 之间');return}c.status='FROZEN';c.frozen_at=TODAY+' 10:00:00';c.frozen_until=addDays(TODAY,days);c.frozen_reason=reason;c.frozenReason=reason;c.updated_at=TODAY+' 10:00:00';closeModal();toast('冻结成功');renderAdminPage();renderStuPage()}
/* 解冻:无冲突→二次确认直接解冻;有冲突→打开"冻结到期-课程冲突"处理弹窗 */
function adminUnfreeze(id){const c=cardById(id);if(adminHasConflict(c)){openConflictModal(id);return}openModal(confirmBox('提前解冻确认',`确定要提前解冻学员「${c.student}」的会员卡吗？解冻后卡片将立即恢复正常使用。`,'','确定解冻',`adminUnfreezeDo('${id}')`))}
function adminUnfreezeDo(id){const c=cardById(id);c.status='ACTIVE';c.frozen_at=null;c.frozen_until=null;c.frozen_reason=null;c.frozenReason=null;c.updated_at=TODAY+' 10:00:00';closeModal();toast('解冻成功');renderAdminPage();renderStuPage()}
/* 冻结到期-课程冲突处理弹窗(对齐真实 conflictDialog) */
function openConflictModal(id){
  STATE.conflictCardId=id;STATE.conflictAction='unfreeze_and_cancel';
  const c=cardById(id);const conflicts=CARDS.filter(o=>o.id!==id&&o.studentId===c.studentId&&o.applicable_course_type_code===c.applicable_course_type_code&&['ACTIVE','PENDING'].includes(o.status));
  const list=conflicts.map(o=>`<div class="confirm-box" style="margin-top:8px"><div class="row"><span class="k">${o.product_name}</span><span>#${o.card_no}</span></div><div class="row"><span class="k">明细</span><span>状态：${(ADMIN_ST[o.status]||{t:'-'}).t}${o.card_type==='count'?` | 剩余：${o.remaining_credits}次`:''} | 有效期：${(o.valid_from&&o.expire_at)?`${o.valid_from} ~ ${o.expire_at}`:'-'}</span></div></div>`).join('');
  openModal(`<div class="m-head"><h3>⚠️ 冻结到期-课程冲突 <span class="muted">P-A2</span></h3><button class="btn-text" onclick="closeModal()">✕</button></div>
  <div class="m-body">
    <div class="confirm-box">
      <div class="row"><span class="k">产品名称</span><span>${c.product_name||'会员卡'}</span></div>
      <div class="row"><span class="k">会员卡号</span><span>${c.card_no||'-'}</span></div>
      <div class="row"><span class="k">冻结到期</span><span>${c.frozen_until?c.frozen_until+' 23:59:59':'-'}</span></div>
    </div>
    <h4 style="margin:12px 0 4px">检测到以下冲突卡：</h4>${list||'<div class="muted">无</div>'}
    <h4 style="margin:12px 0 6px">请选择处理方式：</h4>
    <div class="chk-line"><label><input type="radio" name="cf-act" ${STATE.conflictAction==='unfreeze_and_cancel'?'checked':''} onclick="STATE.conflictAction='unfreeze_and_cancel'"> 解冻并作废冲突卡（冲突卡剩余次数清零）</label></div>
    <div class="chk-line"><label><input type="radio" name="cf-act" ${STATE.conflictAction==='unfreeze_and_freeze'?'checked':''} onclick="STATE.conflictAction='unfreeze_and_freeze'"> 解冻并冻结冲突卡（冲突卡冻结365天）</label></div>
    <div class="form-row" style="margin-top:10px"><label>操作备注</label><textarea id="cf-remark" rows="2" placeholder="请输入操作备注（可选）"></textarea></div>
    ${confirmedNote(3,'冲突处理为原型扩展:真实含 unfreezeWithConflict 端点(action/remark/conflict_card_ids)')}
  </div>
  <div class="m-foot"><button onclick="closeModal()">取消</button><button class="btn-primary" onclick="doConflictAction('${id}')">确认</button></div>`,true);
}
function doConflictAction(id){
  const c=cardById(id);const act=STATE.conflictAction||'unfreeze_and_cancel';
  const conflicts=CARDS.filter(o=>o.id!==id&&o.studentId===c.studentId&&o.applicable_course_type_code===c.applicable_course_type_code&&['ACTIVE','PENDING'].includes(o.status));
  conflicts.forEach(o=>{if(act==='unfreeze_and_cancel'){o.status='CANCELLED';o.remaining_credits=0;o.remaining=0;o.cancelReason='冻结到期冲突,剩余次数清零'}else{o.status='FROZEN';o.frozen_at=TODAY+' 10:00:00';o.frozen_until=addDays(TODAY,365);o.frozen_reason='冲突冻结365天';o.frozenReason=o.frozen_reason}o.updated_at=TODAY+' 10:00:00'});
  c.status='ACTIVE';c.frozen_at=null;c.frozen_until=null;c.frozen_reason=null;c.frozenReason=null;c.updated_at=TODAY+' 10:00:00';
  closeModal();toast('操作成功');renderAdminPage();renderStuPage();
}

/* 产品切换:按真实渲染 总次数/有效天数(只读 disabled)/无限卡 tag,数值由产品决定 */
function issueProdChange(){
  const pEl=document.getElementById('if-prod');const pid=pEl?pEl.value:STATE.issuePid;const p=PRODUCTS.find(x=>x.id===pid)||PRODUCTS[0];
  STATE.issuePid=p.id;
  const code=p.type==='credits'?'count':p.type;
  let h='';
  if(code==='count'){
    h+=`<div class="form-row"><label>总次数</label><input value="${p.credits}" disabled readonly style="background:#f5f7fa"><span class="hint" style="margin-top:6px">次数由产品决定，不可修改</span></div>`;
    h+=`<div class="form-row"><label>有效天数</label><input value="${p.validity_days}" disabled readonly style="background:#f5f7fa"><span class="hint" style="margin-top:6px">天数由产品决定，不可修改</span></div>`;
  } else if(code==='period'){
    h+=`<div class="form-row"><label>有效天数</label><input value="${p.validity_days}" disabled readonly style="background:#f5f7fa"><span class="hint" style="margin-top:6px">天数由产品决定，不可修改</span></div>`;
  } else {
    h+=`<div class="form-row"><label>计费方式</label><span>${ctTagProduct(code)}</span><span class="hint" style="margin-top:6px">无限卡无次数和天数限制</span></div>`;
  }
  h+=`<div class="form-row"><label>适用课程类型</label><span>${courseTypeTag(p.applicable_course_type_code)}</span></div>`;
  const box=document.getElementById('if-dynamic');if(box)box.innerHTML=h;
}
function issueDo(){
  const pEl=document.getElementById('if-prod');const pid=pEl?pEl.value:STATE.issuePid;const p=PRODUCTS.find(x=>x.id===pid)||PRODUCTS[0];
  const dEl=document.getElementById('if-date');const nEl=document.getElementById('if-note');
  const validFrom=(dEl?dEl.value:'').trim();const note=(nEl?nEl.value:'').trim();
  /* 同学员同课程类型已有 ACTIVE/PENDING 卡 → 先弹续卡提示(真实由后端 409 触发) */
  const dup=CARDS.filter(c=>c.studentId==='U1'&&c.applicable_course_type_code===p.applicable_course_type_code&&['ACTIVE','PENDING'].includes(c.status));
  if(dup.length&&!STATE.issueRenew){STATE.issueValidFrom=validFrom;STATE.issuePid=p.id;openRenewalModal(dup,p);return}
  const code=p.type==='credits'?'count':p.type;
  const no='MC'+TODAY.replace(/-/g,'')+String(CARDS.length+1).padStart(3,'0');
  const nc={id:'C'+(CARDS.length+1),student:'张小明',studentId:'U1',student_phone:'138****8888',productId:p.id,product_name:p.name,productName:p.name,
    card_type:code,type:p.type,status:'PENDING',used:0,total:code==='count'?p.credits:null,remaining:code==='count'?p.credits:null,
    valid_from:validFrom||null,expire_at:null,validity_days:p.validity_days,applicable_course_type_code:p.applicable_course_type_code,
    card_no:no,cardNo:no,issueDate:TODAY,created_at:TODAY+' 10:00:00',updated_at:TODAY+' 10:00:00',note:note||null,frozenReason:null,cancelReason:null};
  CARDS.push(nc);TXNS[nc.id]=[{time:TODAY+' 10:00',type:'发放',delta:'+0',balance:code==='count'?p.credits:'-',note:'发卡 ISSUE'}];
  STATE.issueRenew=false;STATE.issueValidFrom='';normCards();closeModal();toast('发放成功:状态 PENDING');renderAdminPage();renderStuPage();
}
/* 续卡提示弹窗(对齐真实 renewal-dialog;原"允许同产品重复发卡"复选框已删除) */
function openRenewalModal(dup,p){
  const maxExp=dup.map(c=>c.expire_at).filter(Boolean).sort().pop();
  const earliest=maxExp?addDays(maxExp,1):TODAY;
  STATE.issueValidFrom=earliest;
  openModal(`<div class="m-head"><h3>续卡提示 <span class="muted">(P-A3)</span></h3><button class="btn-text" onclick="closeModal()">✕</button></div>
  <div class="m-body">

/* ---------- P-A6 排期签到点名 ---------- */
function adminA6(){
  const opts=SCHEDULES.map(s=>`<option value="${s.id}" ${STATE.teacherSched===s.id?'selected':''}>${s.course} ${s.date} ${s.time} (${s.state==='today'?'今日可签到':s.state==='open'?'可预约':s.state==='full'?'满员':''})</option>`).join('');
  const roster=STATE.teacherSched==='S1'?S1R:S3R;
  let rows=roster.map(r=>`<tr>
    <td>${r.name}</td><td>${badge(r.status==='BOOKED'?'BOOKED':r.status==='CHECKED_IN'?'CHECKED_IN':'COMPLETED')}</td>
    <td>${r.cardNo}<br>${badge(r.cardStatus)}</td><td>${r.checkInTime||'—'}</td>
    <td>
      ${r.status==='BOOKED'?(r.cardStatus!=='ACTIVE'?'<button class="btn-text btn-sm" style="color:#f56c6c" onclick="adminCheckIn(\''+r.bId+'\')">代签到</button>':'<button class="btn-text btn-sm" onclick="adminCheckIn(\''+r.bId+'\')">代签到</button>'):''}
      ${r.status==='CHECKED_IN'?'<button class="btn-text btn-sm" onclick="adminComplete(\''+r.bId+'\')">完成</button>':''}
      ${r.status==='BOOKED'||r.status==='CHECKED_IN'?'<button class="btn-text btn-sm" disabled style="opacity:.5">标记缺席</button>':''}
    </td>
  </tr>`).join('');
  return `<div class="toolbar">排期:<select onchange="STATE.teacherSched=this.value;renderAdminPage();renderTeacher()">${opts}</select>
    <span class="muted">D9: 签到校验计划卡状态,非 ACTIVE 拦截</span></div>
  <div class="scroll-x"><table class="el"><thead><tr><th>学员</th><th>预约状态</th><th>计划卡</th><th>签到时间</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table></div>
  ${confirmedNote(5,'缺席(NO_SHOW)自动消解:排期COMPLETED即扣,是否到场不影响扣次;"标记缺席"仅记录,不触发回补(灰置)')}
  ${confirmedNote(1,'签到/完成不再扣次,扣次在预约时已发生(预扣);此处签到仅推进预约状态')}`;
}
function adminCheckIn(bId){
  // find roster entry
  const roster=STATE.teacherSched==='S1'?S1R:S3R;
  const r=roster.find(x=>x.bId===bId);
  if(r.status==='CHECKED_IN'){toast('该学员已签到,请勿重复');return}
  if(r.cardStatus!=='ACTIVE'){
    openModal(`<div class="m-head"><h3>签到拦截 <span class="muted">D9</span></h3><button class="btn-text" onclick="closeModal()">✕</button></div>
    <div class="m-body"><div class="warn-bar"><span class="ic">⛔</span><div><b>该会员卡状态异常,无法签到</b><br>卡 ${r.cardNo} 当前状态:${badge(r.cardStatus)}<br>建议:引导学员换卡或联系机构(人工兜底)</div></div></div>
    <div class="m-foot"><button onclick="closeModal()">知道了</button></div>`);
    return;
  }
  r.status='CHECKED_IN';r.checkInTime='19:03';toast('代签到成功');renderAdminPage();renderTeacher();
}
function adminComplete(bId){
  const roster=STATE.teacherSched==='S1'?S1R:S3R;
  const r=roster.find(x=>x.bId===bId);
  if(r.status!=='CHECKED_IN'){toast('请先签到');return}
  r.status='COMPLETED';
  // 排期 COMPLETED: 次卡确认不回补; 期卡若PENDING则激活
  const b=bookingById(bId);
  if(b){
    b.status='COMPLETED';
    if(b.cardId&&b.cardType==='period'){
      const c=cardById(b.cardId);
      if(c&&c.status==='PENDING'){c.status='ACTIVE';c.valid_from=b.date;c.expire_at=addDays(b.date,c.validity_days);toast('排期完成→期卡已激活,D9')}
    }
  }
  toast('已完成:排期COMPLETED确认扣次');renderAdminPage();renderTeacher();renderStuPage();
}

  const bar=document.getElementById('stu-tabbar');

    return `<div class="tab-item ${active?'active':''}" onclick="stuTab('${d.p}')">`

const AI_QUICK=[

  {ic:'wallet', q:'我的课卡还剩多少次？'},

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
/* 模拟回复:按关键词给出示例答案,并引用原型内真实演示数据(会员卡余额/预约记录) */
function aiReplyFor(text){
  const t=text||'';
  if(/预约课程|怎么约|如何预约/.test(t)){
    return '预约课程步骤：\n1) 点底部「排期」选择日期与课程分类；\n2) 找到想上的排期，点击「立即预约」；\n3) 在底部弹窗选择要扣次的会员卡；\n4) 确认后即预约成功（次卡当场预扣 1 次）。';
  }
  if(/剩多少|剩余|余额|课卡|课时/.test(t)){
    const c=(CARDS||[]).find(x=>x.studentId==='U1'&&x.type==='credits'&&x.status==='ACTIVE')||(CARDS||[]).find(x=>x.type==='credits');
    return c?('您当前使用的次卡剩余 '+c.remaining+' 次（共 '+c.total+' 次）。\n可在「我的 → 我的会员卡」查看有效期与使用记录。')
            :'暂未查询到您的次卡信息，可在「我的 → 我的会员卡」查看。';
  }
  if(/取消|改约|改期|退课/.test(t)){
    return '取消预约：进入「我的 → 预约记录」，开课前 '+CANCEL_MINUTES+' 分钟内不可取消；次卡取消会即时回补 1 次。\n改约/改派为待开发能力，暂未开放。';
  }
  if(/预约了|我的预约|最近预约|记录/.test(t)){
    const list=(BOOKINGS||[]).filter(b=>b.studentId==='U1').slice(0,3);
    if(!list.length)return '您当前暂无预约记录，可以在「排期」中选择课程进行预约。';
    return '您最近的预约：\n'+list.map((b,i)=>' '+(i+1)+'. '+b.course+' · '+b.date+' '+b.time+'（'+b.status+'）').join('\n');
  }
  return '我是课程助手，可以帮您了解预约流程、会员卡余额、取消规则与近期预约。您可以点选下方常用问题，或直接输入您的问题。';
}

/* 发送:注入用户消息 → 进入加载中 → 延时给出模拟回复(650ms 贴近真实交互) */
function aiAsk(text){
  const t=(text||'').trim();
  if(!t||STATE.aiLoading)return;
  STATE.aiMsgs.push({r:'user',t:t});
  STATE.aiLoading=true; STATE.aiErr=false;
  renderStuPage();
  if(STATE.aiTimer)clearTimeout(STATE.aiTimer);
  STATE.aiTimer=setTimeout(aiResolve,650);
}
function aiSend(){const inp=document.getElementById('ai-input');aiAsk(inp?inp.value:'')}
function aiInputChange(el){const s=document.getElementById('ai-send');if(s)s.classList.toggle('active',!!(el.value||'').trim())}
/* 回复:输入「错误/异常/error/报错」触发演示用错误态,其余走关键词模拟回复 */
function aiResolve(){
  if(STATE.aiTimer){clearTimeout(STATE.aiTimer);STATE.aiTimer=null}
  const last=[...STATE.aiMsgs].reverse().find(m=>m.r==='user');
  const t=last?last.t:'';
  STATE.aiLoading=false;
  if(/^(错误|异常|error|报错)/i.test(t.trim())){
    STATE.aiErr=true;
    STATE.aiMsgs.push({r:'ai',t:'抱歉，本次请求出现异常（演示用错误状态）。请稍后重试。',err:true});
  }else{
    STATE.aiMsgs.push({r:'ai',t:aiReplyFor(t)});
  }
  renderStuPage();
}
function aiClear(){
  if(STATE.aiTimer){clearTimeout(STATE.aiTimer);STATE.aiTimer=null}
  STATE.aiMsgs=[]; STATE.aiLoading=false; STATE.aiErr=false;
  renderStuPage();
}

/* 单张卡 DOM:.card-item > .card-content > .card-header/.card-no-row/.card-usage */
function stuCardItem(c){
  const type=c.card_type;
  let usage;
  if(type==='count'){
    const zero=c.remaining_credits===0;
    usage=`<div class="credits-display"><span class="credits-remaining ${zero?'zero':''}">${c.remaining_credits}</span><span class="credits-separator">/</span><span class="credits-total">${c.total_credits}</span><span class="credits-unit">次</span></div>`;
  }else if(type==='period'){
    const days=c.valid_from?daysBetween(TODAY,c.expire_at):c.validity_days;
    usage=`<div class="credits-display"><span class="credits-label">剩余</span><span class="credits-remaining">${days}</span><span class="credits-unit">天</span></div>`;
  }else{
    usage=`<div class="credits-display"><span class="credits-remaining">∞</span><span class="usage-unlimited-text">不限次</span></div>`;
  }
  const vr=c.valid_from
    ?`<div class="usage-valid-range"><span class="vr-k">有效期至</span>${c.expire_at}</div>`
    :`<div class="usage-valid-range"><span class="vr-k">有效期</span>首次上课后起算</div>`;
  const st=mStatus(c);
  // 使用区:行内激活(可激活) / 警告框(不可激活) / 解冻
  let usageBlock=`<div class="card-usage"><div class="usage-main">${usage}<div class="usage-divider-line"></div>${vr}</div></div>`;
  if(st==='PENDING'){
    const block=cardActivationBlock(c);
    if(!block){
      usageBlock=`<div class="card-usage usage-inline usage-with-activate"><div class="usage-main">${usage}<div class="usage-divider-line"></div>${vr}</div>`
        +`<button class="activate-btn-inline" onclick="event.stopPropagation();stuActivate('${c.id}')"><span class="activate-btn-text">立即激活</span></button></div>`;
    }else{
      usageBlock+=`<div class="activation-warning-box"><span class="warn-ic">${ri('warning','#c9a66b',16)}</span><div><div class="warning-title">当前无法激活</div><div class="warning-desc">${block}</div></div></div>`;
    }
  }else if(st==='FROZEN'){
    usageBlock+=`<div style="margin-top:10px"><button class="stu-mini-btn" style="color:#4a7bd4;border-color:rgba(100,149,237,.5)" onclick="event.stopPropagation();toast('提前解冻需冲突检查(演示)')">提前解冻</button></div>`;
  }
  return `<div class="card-item ${cardCls(c)}">
    <div class="card-content">
      <div class="card-main">
        <div class="card-header">
          <span class="card-name">${c.product_name}</span>

        <div class="card-no-row">

        </div>
        ${usageBlock}
      </div>
    </div>
  </div>`;
}

/* 真实 getActivationBlockReason(L844-L864):同课程类型已有"使用中"卡则禁止激活 */

/* ---- P-M3 课程排期:与真实 pages/student/schedule/index.vue 同构 ---- */
const SCHED_CATS=[{k:'all',t:'全部'},{k:'regular',t:'常规课'},{k:'private',t:'私教课'},{k:'special',t:'特色课'}];
const CCT_TXT={private:'私教课',regular:'常规课',special:'特色课'};
const CCT_CLS={private:'tag-private',regular:'tag-regular',special:'tag-special'};
const DAY_NAMES=['周日','周一','周二','周三','周四','周五','周六'];
function dsLocal(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
/* 真实 dateList:今日前后滚动窗口(原型取 -1..+3),name=今日/明日/周X,dateStr=MM-DD */
function stuDateList(){
  const base=new Date(TODAY+'T00:00:00'),out=[];
  for(let i=-1;i<=3;i++){
    const d=new Date(base);d.setDate(base.getDate()+i);
    out.push({date:dsLocal(d),name:i===0?'今日':i===1?'明日':DAY_NAMES[d.getDay()],dateStr:String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')});
  }
  return out;
}
function schedStart(s){return new Date(s.date+'T'+s.time.split('-')[0]+':00')}
function schedBookedMine(s){return BOOKINGS.some(b=>b.studentId==='U1'&&b.scheduleId===s.id&&(b.status==='BOOKED'||b.status==='CHECKED_IN'))}
function schedCardOK(s){return bookCardOptions(s).some(o=>!o.disabled)}
function stuSchedCat(k){if(STATE.schedCat===k)return;STATE.schedCat=k;renderStuPage()}
function stuSchedDate(d){if(STATE.schedDate===d)return;STATE.schedDate=d;renderStuPage()}
/* 真实 displaySchedules 判定(L242-L361):已约/已满/已过期/取消时限 → 文案与状态类 */
function schedView(s){
  const isBooked=schedBookedMine(s),isFull=s.booked>=s.capacity;
  const mins=(schedStart(s)-new Date(DEMO_NOW))/60000;
  const isOngoing=mins<=0,withinLimit=mins<=CANCEL_MINUTES&&mins>0;
  if(isBooked){
    const blocked=isOngoing||withinLimit;
    return {text:blocked?'不可取消':'取消',cls:'booked',disabled:blocked,
      hint:isOngoing?'课程已开始,不可取消':withinLimit?`开课前${CANCEL_MINUTES}分钟内不可取消`:'',
      act:blocked?`stuSchedBlocked(${isOngoing?'1':'0'})`:`stuSchedCancel('${s.id}')`};
  }
  if(isOngoing)return {text:'已完成',cls:'disabled',disabled:true,hint:'',act:''};
  if(isFull)return {text:'已满',cls:'disabled',disabled:true,hint:'',act:''};
  if(!schedCardOK(s))return {text:'无会员卡',cls:'no-card',disabled:true,hint:'您需要先办理会员卡才能预约课程',act:''};
  return {text:'预约',cls:'',disabled:false,hint:'',act:`selectSched('${s.id}')`};
}
function stuSchedBlocked(ongoing){
  openModal(`<div class="m-head"><h3>无法取消 <span class="muted">P-M3</span></h3><button class="btn-text" onclick="closeModal()">✕</button></div>
  <div class="m-body"><p>${ongoing?'课程已开始，不可取消预约':`开课前 ${CANCEL_MINUTES} 分钟内不可取消预约，请准时参加课程`}</p></div>
  <div class="m-foot"><button class="btn-primary" onclick="closeModal()">知道了</button></div>`);
}

   结构: 课程信息卡 + 使用会员卡卡 + 注意事项卡 + 底部操作栏;选卡=底部弹窗(非内联列表) */
const CARD_TYPE_TXT={count:'次卡',period:'期卡',unlimited:'无限卡'};
function cardRemainText(c){
  if(c.card_type==='count')return `剩余 ${c.remaining_credits}/${c.total_credits} 次`;

/* 真实 isAvailable/unavailableReason 判定(按状态/次卡余额/期卡区间重叠) */
function bookCardOptions(s){
  return CARDS.filter(c=>c.studentId==='U1').map(c=>{
    const st=mStatus(c),gk=cardGroupKey(c);
    let reason='';
    if(gk==='invalid')reason=st==='EXPIRED'?'已过期':'已作废';
    else if(st==='FROZEN')reason='冻结中';
    else if(st==='USED_UP')reason='已用完';
    else if(c.card_type==='period'&&!!cardConflict(c,s.date))reason='有效期重叠';
    return {id:c.id,card:c,disabled:!!reason,reason};
  });
}

  </div>`;
  // ② 使用会员卡卡
  const cardBody=sc
    ?`<div class="selected-card-info" onclick="openCardSel()">
        <div class="card-details">
          <div class="cd-name">${sc.product_name}</div>
          <div class="cd-sub">${cardRemainText(sc)}</div>
          <div class="cd-applicable">卡号 ${sc.card_no}</div>
        </div>
        <div class="card-right"><span class="type-badge type-${sc.card_type}">${CARD_TYPE_TXT[sc.card_type]}</span><span class="arrow">${ri('arrow-right','#b8956a',16)}</span></div>
      </div>`
    :`<div class="selected-card-info" onclick="openCardSel()"><span class="muted">请选择会员卡</span><span class="arrow">${ri('arrow-right','#b8956a',16)}</span></div>`;
  html+=`<div class="use-card-card">
    <div class="card-header"><div class="header-left"><span class="header-icon">${ri('card','#fff',16)}</span><span class="card-label">使用会员卡</span><span class="header-line"></span></div></div>
    ${cardBody}
  </div>`;
  // ③ 注意事项卡
  const notices=['开课前 90 分钟内不可取消预约','请准时到达教室,迟到可能影响上课','如需取消请提前在"我的预约"中操作'];
  html+=`<div class="notice-card">
    <div class="card-header"><div class="header-left"><span class="header-icon">${ri('alert','#fff',16)}</span><span class="card-label">注意事项</span><span class="header-line"></span></div></div>
    <div style="margin-top:6px">${notices.map(t=>`<div class="notice-item"><span class="notice-diamond">◆</span><span>${t}</span></div>`).join('')}</div>
  </div>`;
  // ④ 底部操作栏
  const canBook=!!sc&&avail.length>0;
  html+=`<div class="action-bar">
    <button class="action-btn cancel-btn" onclick="goStu('P-M3')">取消</button>
    <button class="action-btn confirm-btn" ${canBook?'':'disabled'} onclick="submitBooking()">确认预约</button>
  </div>`;
  html+=confirmedNote(9,'PENDING 期卡正常可选(不进无效区);期卡按"排期日+有效天数"预算预期有效期,与已有同产品期卡区间重叠则不可选(演示:卡 C1 与已生效期卡 C8 区间重叠被拦截)');
  // 选卡底部弹窗
  html+=`<div class="card-selector-mask" ${STATE.cardSelOpen?'':'style="display:none"'} onclick="closeCardSel()">
    <div class="card-selector-popup" onclick="event.stopPropagation()">
      <div class="selector-header"><span class="selector-title">选择会员卡</span><span class="selector-close" onclick="closeCardSel()">✕</span></div>
      ${avail.length
        ?`<div class="card-list-scroll">${opts.map(cardOptionRow).join('')}</div>`
        :`<div class="no-available-cards"><div class="no-cards-text">暂无可用的会员卡</div></div>`}
      <div class="selector-footer"><button class="footer-btn" onclick="confirmCardSel()">确定</button></div>
    </div>
  </div>`;
  return html;
}
function cardOptionRow(o){
  const c=o.card;
  const sel=STATE.bookCardId===c.id&&!o.disabled;
  return `<div class="card-option ${sel?'card-selected':''} ${o.disabled?'card-disabled':''}" ${o.disabled?'':`onclick="pickBookCard('${c.id}')"`}>
    <div class="card-option-left">
      <span class="card-radio ${sel?'radio-checked':''}"><span class="radio-dot"></span></span>
      <div class="card-option-info">
        <div class="card-option-name">${c.product_name}</div>
        <div class="card-option-remaining">${cardRemainText(c)}${o.reason?' · '+o.reason:''}</div>
        <div class="card-option-applicable">卡号 ${c.card_no}</div>
      </div>
    </div>
    <span class="card-option-type"><span class="type-badge type-${c.card_type}">${CARD_TYPE_TXT[c.card_type]}</span></span>
  </div>`;
}
function openCardSel(){STATE.cardSelOpen=true;renderStuPage()}
function closeCardSel(){STATE.cardSelOpen=false;renderStuPage()}
function confirmCardSel(){STATE.cardSelOpen=false;renderStuPage()}
function pickBookCard(id){STATE.bookCardId=id;renderStuPage()}
function submitBooking(){
  const s=schedById(STATE.selSchedId);const c=cardById(STATE.bookCardId);
  if(!c){toast('请选择会员卡');return}
  // D9 冲突最终校验
  if(c.type==='period'&&cardConflict(c,s.date)){toast('该卡预期有效期与已有卡重叠,不可预约');return}
  if(c.type==='credits'&&c.remaining<=0){toast('该卡已用尽');return}
  if(c.status==='FROZEN'){toast('该卡已冻结');return}
  // 跨排期时间段重叠校验(与上方卡有效期重叠相互独立;真实后端 create_booking 尚未实现)
  const tc=scheduleTimeConflict(s);
  if(tc){toast('该时间段与您已约课程《'+tc.course+'》冲突（'+s.time+' 与 '+tc.time+'），无法预约');return}
  openModal(confirmBox('确认预约','确认使用 '+c.productName+' 预约 '+s.course+'?','写操作将预扣次(次卡)/不扣次(期卡)','确认预约','doBooking()'));
}
function doBooking(){
  const s=schedById(STATE.selSchedId);const c=cardById(STATE.bookCardId);
  closeModal();
  if(c.type==='credits'){c.remaining-=1;c.used+=1;TXNS[c.id].push({time:TODAY+' 19:00',type:'消费',delta:'-1',balance:c.remaining,booking:s.course+' '+s.date,note:'预约预扣'});STATE.bookResult={schedId:s.id,cardId:c.id,after:c.remaining,kind:'credits'}}
  else{STATE.bookResult={schedId:s.id,cardId:c.id,kind:'period',expFrom:s.date,expTo:addDays(s.date,c.validity_days)}}
  // 创建新预约
  const nb={id:'B'+(BOOKINGS.length+1),student:'张小明',studentId:'U1',scheduleId:s.id,cardId:c.id,cardNo:c.cardNo,cardStatus:c.status,cardType:c.type,status:'BOOKED',source:'SELF',course:s.course,date:s.date,time:s.time,room:s.room,teacher:s.teacher,cancelReason:null};
  BOOKINGS.push(nb);
  s.booked+=1;
  toast('预约成功');goStu('P-M5');renderAdminPage();
}

/* P-M5 预约结果 */
function stuM5(){
  const r=STATE.bookResult||{};const s=schedById(r.schedId);const c=cardById(r.cardId);
  const ban=pendingBanner('预约结果页：真实小程序无独立结果页，预约成功直接进入我的预约');
  if(r.fail)return ban+errorState(r.fail==='full'?'该排期名额已满,无法预约':'预约失败,请重试','重新选择',`STATE.bookResult=null;goStu('P-M3')`);
  if(!s)return ban+emptyState('无预约结果','返回首页',`goStu('P-M3')`);
  let info;
  if(r.kind==='credits')info=`<div class="result-info"><div class="line"><span class="k">课程</span><span>${s.course}</span></div><div class="line"><span class="k">时间</span><span>${s.date} ${s.time}</span></div><div class="line"><span class="k">已预扣</span><span>1 次</span></div><div class="line"><span class="k">剩余</span><span>${r.after} 次</span></div></div>`;
  else info=`<div class="result-info"><div class="line"><span class="k">课程</span><span>${s.course}</span></div><div class="line"><span class="k">时间</span><span>${s.date} ${s.time}</span></div><div class="line"><span class="k">期卡</span><span>不扣次</span></div><div class="line"><span class="k">预期有效期</span><span>${r.expFrom} ~ ${r.expTo}</span></div></div>`;
  return ban+`<div class="result-box"><div class="big">${ri('check-circle','var(--green)',42)}</div><h3>${r.kind==='credits'?'预约成功 · 已预扣 1 次':'预约成功 · 首次上课后激活'}</h3>
    <div class="muted">${r.kind==='credits'?'排期完成后确认扣次,取消将回补':'期卡 PENDING,排期 COMPLETED 时激活并写入有效期'}</div>${info}
    ${r.kind==='period'?confirmedNote(9,'期卡 PENDING:首次排期 COMPLETED 才激活,在此之前不消耗有效期'):''}
    <button class="stu-btn" style="margin-top:14px" onclick="goStu('P-M6')">查看我的预约</button>
    <button class="stu-btn outline" style="margin-top:10px" onclick="goStu('P-M3')">返回首页</button></div>`;
}

/* P-M6 我的预约 —— 严格复刻 pages/student/bookings/index.vue
   结构: filter-tabs 四 Tab → booking-card(.card-info + .card-actions);取消时限来自 booking_cancel_minutes */
function stuBookTab(k){STATE.bookTab=k;renderStuPage()}
function stuM6(){
  const all=BOOKINGS.filter(b=>b.studentId==='U1');
  const tab=STATE.bookTab||'all';
  const list=tab==='all'?all:all.filter(b=>b.status===tab);
  // 真实预约记录页为 native navbar(标题"我的预约"+返回),从"我的"进入;此处以返回条复现返回能力
  let html='<div class="stu-backbar" onclick="goStu(\'P-M9\')"><span>‹</span><span>返回</span></div>';
  html+='<div class="filter-tabs">'+BOOK_TABS.map(t=>`<div class="filter-tab ${tab===t.k?'tab-active':''}" onclick="stuBookTab('${t.k}')">${t.t}</div>`).join('')+'</div>';
  if(!list.length){html+=`<div class="empty-state"><span class="empty-ill">${ri('calendar-empty','#d0c0b0',60)}</span><span class="empty-title">暂无预约记录</span></div>`;return html;}
  html+=list.map(bookingCardItem).join('');
  html+=sticky(7,'取消时限由租户配置 booking_cancel_minutes(默认 90 分钟)驱动;进入时限后"取消预约"替换为不可点击提示');
  html+=confirmedNote(3,'计划卡失效警示条(下方红色条)为新增占位:真实页面暂无该条,需待 D7 接口落地;换卡为待开发原子端点');
  return html;
}
function bookingCardItem(b){
  const cardFail=['CANCELLED','EXPIRED','FROZEN','USED_UP'].includes(b.cardStatus)&&['BOOKED','CHECKED_IN'].includes(b.status);
  let warn='';
  if(cardFail)warn=`<div class="warn-bar"><span class="ic">${ri('alert','#a33',16)}</span><div><b>待新增 · 计划卡已${b.cardStatus==='CANCELLED'?'作废':b.cardStatus==='EXPIRED'?'过期':b.cardStatus==='FROZEN'?'冻结':'用尽'}</b><br>该预约的会员卡当前不可用,请换卡或联系机构<div style="margin-top:8px;display:flex;gap:8px"><button class="stu-mini-btn" onclick="toast('换卡改派:待开发原子端点(D7)')">换卡(占位)</button><button class="stu-mini-btn" onclick="toast('已为你联系机构')">联系机构</button></div></div></div>`;
  let actions='';
  if(b.status==='BOOKED'){
    actions=canCancelBooking(b)
      ?`<button class="cancel-btn" onclick="STATE.cancelBId='${b.id}';openCancelModal()">取消预约</button>`
      :`<span class="cancel-disabled">开课前 ${CANCEL_MINUTES} 分钟内不可取消</span>`;
  }
  const foot=(actions||b.cancelReason)
    ?`<div class="card-actions">${b.cancelReason?`<span class="cancel-disabled">取消原因:${b.cancelReason}</span>`:actions}</div>`:'';
  return `<div class="booking-card">
    <div class="card-info">
      <div class="info-top"><span class="bk-course">${b.course}</span>${bookingStatusBadge(b)}</div>
      <div class="info-row"><span class="ir-ic">${ri('calendar','#b8956a',14)}</span><span class="info-text">${b.date} ${b.time}</span></div>
      <div class="info-row"><span class="ir-ic">${ri('location','#b8956a',14)}</span><span class="info-text">${b.room||'未安排教室'}</span></div>
      <div class="info-row"><span class="ir-ic">${ri('user','#b8956a',14)}</span><span class="info-text">${b.teacher||'未知'}</span></div>
    </div>
    ${warn}
    ${foot}
  </div>`;
}
function openCancelModal(){
  const b=bookingById(STATE.cancelBId);if(!b)return;
  const c=cardById(b.cardId);
  let refund='';
  if(b.cardType==='credits')refund=`<div class="confirm-box"><div class="row"><span class="k">排期</span><span>${b.course} ${b.date}</span></div><div class="row"><span class="k">原卡</span><span>${b.cardNo}</span></div><div class="row"><span class="k">当前剩余</span><span>${c?c.remaining:'—'} 次</span></div><div class="row" style="color:var(--green)"><span class="k">取消后回补</span><span>+1 次 → ${c?c.remaining+1:'—'} 次</span></div></div>`;
  else refund=`<div class="confirm-box"><div class="row"><span class="k">排期</span><span>${b.course} ${b.date}</span></div><div class="row"><span class="k">期卡</span><span>不扣次,取消不回补,保持 PENDING</span></div></div>`;
  openModal(`<div class="m-head"><h3>取消预约确认 <span class="muted">P-M7</span></h3><button class="btn-text" onclick="closeModal()">✕</button></div>
  <div class="m-body">${refund}${confirmedNote(1,'次卡:取消立即回补(RESTORE),行锁保护;期卡:不激活不回补')}<div class="form-row"><label>取消原因</label><textarea id="cancel-reason" placeholder="选填" rows="2"></textarea></div></div>
  <div class="m-foot"><button onclick="closeModal()">再想想</button><button class="btn-danger" onclick="doCancel()">确认取消</button></div>`);
}
function doCancel(){
  const b=bookingById(STATE.cancelBId);if(!b){closeModal();return}
  if(b.status!=='BOOKED'){toast('已签到/已完成,不可取消');closeModal();return}
  b.status='CANCELLED';b.cancelReason=document.getElementById('cancel-reason').value.trim()||'临时取消';
  if(b.cardType==='credits'&&b.cardId){const c=cardById(b.cardId);if(c){c.remaining+=1;c.used-=1;TXNS[c.id].push({time:TODAY+' 19:30',type:'回补',delta:'+1',balance:c.remaining,booking:b.course+' '+b.date,note:'取消回补 RESTORE'})}}
  closeModal();toast('已取消,次卡已回补 +1');goStu('P-M1');renderAdminPage();
}

/* ============================================================
   TEACHER P-T1
============================================================ */
function renderTeacher(){
  const s=SCHEDULES.find(x=>x.id===STATE.teacherSched)||SCHEDULES[0];
  const opts=SCHEDULES.map(x=>`<option value="${x.id}" ${STATE.teacherSched===x.id?'selected':''}>${x.course} ${x.date} ${x.time}</option>`).join('');
  const roster=STATE.teacherSched==='S1'?S1R:S3R;
  const checked=roster.filter(r=>r.status!=='BOOKED').length;
  const rows=roster.map(r=>{
    const st=r.status==='BOOKED'?'BOOKED':r.status==='CHECKED_IN'?'CHECKED_IN':'COMPLETED';
    const op=r.status==='BOOKED'?`<button class="btn-primary btn-sm" onclick="tchCheckIn('${r.bId}')">签到</button>`
      :r.status==='CHECKED_IN'?`<button class="btn-success btn-sm" onclick="tchComplete('${r.bId}')">完成</button>`
      :`<span class="muted">已完成</span>`;
    const miss=(r.status==='BOOKED'||r.status==='CHECKED_IN')?`<button class="btn-sm" disabled style="opacity:.5">缺席</button>`:'';
    return `<div class="tch-row"><div class="av">${r.name.slice(0,1)}</div>
      <div class="mn"><div class="n">${r.name}</div>
      <div class="d"><span>${r.cardNo}</span>${badge(r.cardStatus)}</div>
      <div class="d">${badge(st)}${r.checkInTime?`<span>签到 ${r.checkInTime}</span>`:''}</div></div>
      <div class="op">${op}${miss}</div></div>`;
  }).join('');
  document.getElementById('tch-body').innerHTML=`<div class="tch-wrap">
    <div class="toolbar" style="display:flex;gap:8px;align-items:center;margin-bottom:10px">排期:<select onchange="STATE.teacherSched=this.value;renderTeacher();if(STATE.adminPage==='P-A6')renderAdminPage()">${opts}</select>
    <span class="muted">D9:签到校验计划卡状态</span></div>
  <div class="tch-head"><h3>${s.course}</h3><div class="sub">${s.date} ${s.time} · ${s.room} · ${s.teacher}</div><div class="tch-info"><span>排期 ${s.id}</span><span>容量 ${s.capacity}</span></div></div>
  <div class="tch-stat"><div class="it"><div class="n">${roster.length}</div><div class="l">已预约</div></div><div class="it"><div class="n">${checked}</div><div class="l">已签到</div></div><div class="it"><div class="n">${roster.length-checked}</div><div class="l">未签到</div></div></div>
  ${rows}
  ${confirmedNote(5,'"标记缺席"灰置:缺席自动消解,排期COMPLETED即扣,不触发回补')}
  ${confirmedNote(1,'签到/完成不扣次,扣次在预约时已发生(预扣)')}`;
}
function tchCheckIn(bId){
  const roster=STATE.teacherSched==='S1'?S1R:S3R;const r=roster.find(x=>x.bId===bId);
  if(r.status==='CHECKED_IN'){toast('该学员已签到,请勿重复');return}
  if(r.cardStatus!=='ACTIVE'){
    openModal(`<div class="m-head"><h3>签到拦截 <span class="muted">D9</span></h3><button class="btn-text" onclick="closeModal()">✕</button></div>
    <div class="m-body"><div class="warn-bar"><span class="ic">⛔</span><div><b>该会员卡状态异常,无法签到</b><br>卡 ${r.cardNo} 当前:${badge(r.cardStatus)}<br>请引导学员换卡或联系机构</div></div></div>
    <div class="m-foot"><button onclick="closeModal()">知道了</button></div>`);
    return;
  }
  r.status='CHECKED_IN';r.checkInTime='19:05';toast('签到成功');renderTeacher();if(STATE.adminPage==='P-A6')renderAdminPage();
}
function tchComplete(bId){
  const roster=STATE.teacherSched==='S1'?S1R:S3R;const r=roster.find(x=>x.bId===bId);
  if(r.status!=='CHECKED_IN'){toast('请先签到');return}
  r.status='COMPLETED';const b=bookingById(bId);
  if(b){b.status='COMPLETED';if(b.cardType==='period'&&b.cardId){const c=cardById(b.cardId);if(c&&c.status==='PENDING'){c.status='ACTIVE';c.valid_from=b.date;c.expire_at=addDays(b.date,c.validity_days);toast('排期完成→期卡已激活')}}}
  toast('已完成:排期COMPLETED确认扣次');renderTeacher();renderStuPage();if(STATE.adminPage==='P-A6')renderAdminPage();
}

/* ============================================================
   FLOW WIZARD + helpers
============================================================ */
function confirmBox(title,sub,desc,btn,fn){
  return `<div class="m-head"><h3>${title}</h3><button class="btn-text" onclick="closeModal()">✕</button></div>
  <div class="m-body"><div class="confirm-box"><div class="row"><span class="k">${sub}</span></div><div class="muted">${desc}</div></div></div>
  <div class="m-foot"><button onclick="closeModal()">取消</button><button class="btn-primary" onclick="${fn}">${btn}</button></div>`;
}
function openFlows(){
  const flows=[
    {id:'A',t:'流程 A:跨端预约',d:'管理后台 P-A2 查看课卡 → 学员小程序 P-M1 → P-M3 选排期 → P-M4 选卡 → P-M5 预约成功',fn:"resetData();setView('dual');goAdmin('P-A2');goStu('P-M1');toast('流程A:左侧管理后台,右侧学员小程序')"},
    {id:'B',t:'流程 B:多卡切换/PENDING可选',d:'P-M4 多卡切换,余额预览联动;PENDING 期卡可选(角标待激活);冲突卡灰显',fn:"resetData();setView('student');goStu('P-M3')"},
    {id:'C',t:'流程 C:取消回补',d:'P-M6 取消 → P-M7 回补预览(+1) → 确认取消 → P-M1 余额+1',fn:"resetData();setView('student');goStu('P-M6')"},
    {id:'D',t:'流程 D:签到完成/重复拒绝',d:'P-T1 签到→完成;P-A6 代签到→重复签到被拒;计划卡已作废签到被拦截',fn:"resetData();setView('teacher')"},
    {id:'E',t:'流程 E:计划卡已作废',d:'P-M6 "计划卡已作废"预约 → 警示条 → 换卡出口(占位)+联系机构',fn:"resetData();setView('student');goStu('P-M6')"},
    {id:'F',t:'流程 F:失效徽标/作废影响面',d:'P-M1 用尽/过期/冻结徽标 → P-A2 作废时影响面提示(占位)',fn:"resetData();setView('dual');goStu('P-M1');goAdmin('P-A2')"},
  ];
  openModal(`<div class="m-head"><h3>演示流程向导</h3><button class="btn-text" onclick="closeModal()">✕</button></div>
  <div class="m-body"><div class="flow-wiz">${flows.map(f=>`<div class="item"><div class="ttl">流程 ${f.id}</div><div class="desc">${f.d}</div><button class="btn-primary btn-sm" onclick="closeModal();${f.fn}">开始流程 ${f.id}</button></div>`).join('')}</div>
  <div class="muted" style="margin-top:8px">每个流程会自动重置数据,确保从干净状态演示。也可点击右上角"重置数据"随时还原。</div></div>`,true);
}

resetData();
