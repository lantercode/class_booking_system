<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F7.0 后台管理端增强与小程序首页配置 · 可交互原型</title>
<style>
:root{
  --blue:#409EFF; --blue-d:#337ecc; --green:#67c23a; --green-d:#5daf34;
  --brand:#667eea; --brand2:#764ba2;
  --gold:#C9A66B; --gold-d:#B8956A; --gold-l:#DBC18A;
  --gold-grad:linear-gradient(135deg,#C9A66B 0%,#D4AF77 50%,#E8D5B7 100%);
  --gold-grad-btn:linear-gradient(135deg,#d4b896 0%,#c9a66b 100%);
  --red:#f56c6c; --orange:#e6a23c; --gray:#909399; --gray-l:#c0c4cc;
  --bg:#f0f2f5; --sidebar:#1a1a2e; --card:#fff; --border:#ebeef5; --border-d:#dcdfe6;
  --text:#303133; --text-2:#606266; --text-3:#909399;
  --shadow:0 2px 12px 0 rgba(0,0,0,.08); --shadow-d:0 2px 16px 0 rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:1px solid var(--border-d);background:#fff;color:var(--text-2);border-radius:4px;padding:7px 14px;font-size:13px;transition:.1s}
.hide{display:none!important}

/* ---------- 外壳：顶栏 + 舞台 + 面板（对齐 F6.0） ---------- */
#topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;padding:0 16px;height:48px;background:#fff;border-bottom:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.04)}
#topbar .brand{font-weight:600;font-size:15px;margin-right:8px;color:var(--blue)}
#topbar .brand small{font-weight:400;color:var(--text-3);font-size:12px;margin-left:6px}
#topbar .spacer{flex:1}
.view-tabs{display:flex;gap:2px;background:#f0f2f5;border-radius:6px;padding:2px}
.view-tabs button{border:none;background:transparent;padding:6px 12px;border-radius:4px;color:var(--text-2)}
.view-tabs button.active{background:#fff;color:var(--blue);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
#stage{display:flex;gap:16px;padding:16px;align-items:flex-start}
.panel{background:#fff;border-radius:8px;box-shadow:var(--shadow);overflow:hidden;flex-shrink:0}
#admin-panel{width:1000px}
.page-title{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);background:#fafafa}
.page-title h2{font-size:15px;font-weight:600}
.page-title .pid{font-size:11px;color:#fff;background:var(--blue);padding:2px 8px;border-radius:10px;margin-right:8px}
.pt-right{display:flex;align-items:center;gap:10px}
.admin-body{display:flex;height:620px}
.admin-side{width:200px;background:#1a1a2e;border-right:none;padding:0 0 8px;overflow-y:auto;flex-shrink:0}
.admin-side .logo{height:60px;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:6px}
.admin-side .logo .ic{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
.admin-side .logo .tt{color:#fff;font-weight:700;font-size:15px}
.admin-side .nav-item{display:flex;align-items:center;padding:11px 18px;font-size:13px;cursor:pointer;color:#a0a0b8;border-left:3px solid transparent}
.admin-side .nav-item .ni{display:inline-block;width:16px;margin-right:8px;opacity:.85}
.admin-side .nav-item .ni svg{width:16px;height:16px;display:inline-block;vertical-align:middle;fill:currentColor}
.admin-side .nav-item:hover{color:#fff;background:rgba(102,126,234,.12)}
.admin-side .nav-item.active{color:#fff;font-weight:600;background:linear-gradient(90deg,rgba(102,126,234,.3),transparent);border-left-color:#667eea}
.admin-side .badge-new{margin-left:auto;font-size:10px;background:var(--red);color:#fff;border-radius:8px;padding:1px 6px}
.admin-main{flex:1;overflow:auto;padding:14px}

.user-area{position:relative}
.user-info{display:flex;align-items:center;gap:8px;cursor:pointer;padding:6px 10px;border-radius:8px}
.user-info:hover{background:#f5f7fa}
.user-info .uname{font-size:14px;color:var(--text)}
.user-info .caret{color:var(--text-3)}
.dropdown{display:none;position:absolute;right:0;top:40px;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-d);min-width:150px;padding:6px;z-index:30}
.dropdown.open{display:block}
.dropdown .di{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:6px;font-size:14px;color:var(--text-2)}
.dropdown .di svg{width:15px;height:15px;fill:currentColor;flex-shrink:0}
.dropdown .di.disabled{color:var(--gray-l);cursor:not-allowed}
.dropdown .di.disabled:hover{background:transparent;color:var(--gray-l)}
.dropdown .di.divider{border-top:1px solid var(--border);margin-top:4px;padding-top:10px;border-radius:0 0 6px 6px}
.dropdown .di:hover{background:#f5f7fa;color:var(--blue)}
.dropdown .di.danger:hover{background:#fef0f0;color:var(--red)}

/* ---------- 通用 Element Plus 风格 ---------- */
.btn{font-family:inherit;cursor:pointer;border:1px solid var(--border-d);background:#fff;color:var(--text-2);border-radius:4px;padding:7px 14px;font-size:13px;transition:.1s}
.btn:hover{color:var(--blue);border-color:#c6e2ff;background:#ecf5ff}
.btn.primary{background:linear-gradient(135deg,#409eff 0%,#3a8ee6 100%);border:none;color:#fff;box-shadow:0 2px 8px rgba(64,158,255,.3)}
.btn.primary:hover{background:linear-gradient(135deg,#3a8ee6 0%,#337ecc 100%);color:#fff;box-shadow:0 4px 12px rgba(64,158,255,.4);transform:translateY(-1px)}
.btn.primary:active{transform:translateY(0)}
/* 面板标题区按钮对齐真实 admin-web 页头按钮规范（radius 8px / font-weight 500 / transition .2s） */
.page-title .btn{border-radius:8px;font-weight:500;transition:all .2s ease}
.btn.ghost{font-family:inherit;cursor:pointer;border:1px solid var(--border-d);background:#fff;color:var(--text-2);border-radius:4px;padding:7px 14px;font-size:13px;transition:.1s}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.link{border:none;background:transparent;color:var(--blue);padding:4px 8px}
.btn.link:hover{background:transparent;color:var(--blue-d)}
.btn.link.warn{color:var(--orange)}
.btn.link.danger{color:var(--red)}
.btn:disabled{cursor:not-allowed;color:var(--gray-l);background:#f5f7fa;border-color:#e4e7ed}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.input{width:100%;padding:8px 10px;border:1px solid var(--border-d);border-radius:4px;font-size:13px;font-family:inherit}
.toolbar .input{padding:6px 10px;border:1px solid var(--border-d);border-radius:4px;font-size:13px}
.input:focus{border-color:var(--blue)}
select.input{cursor:pointer}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;background:#f0f2f5;color:var(--text-2)}
.tag.success{background:#f0f9eb;color:#67c23a;border:1px solid #c2e7b0}
.tag.info{background:#f4f4f5;color:#909399;border:1px solid #e9e9eb}
.tag.warn{background:#fdf6ec;color:#e6a23c;border:1px solid #f5dab1}
.tag.danger{background:#fef0f0;color:#f56c6c;border:1px solid #fbc4c4}
.tag.primary{background:#ecf5ff;color:#409eff;border:1px solid #b3d8ff}
.pending{margin-left:6px;font-size:11px;color:#e6a23c;border:1px dashed #e6a23c;border-radius:4px;padding:0 5px}

/* 表格 */
.tbl{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border:1px solid #ebeef5;border-radius:8px;overflow:hidden}
.tbl th{background:#f5f7fa;color:#303133;font-weight:600;text-align:left;padding:10px 8px;border-bottom:1px solid #ebeef5;white-space:nowrap}
.tbl td{padding:10px 8px;border-bottom:1px solid #ebeef5;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#f5f7fa}
.tbl tbody tr:nth-child(even) td{background:#fafafa}
.tbl tbody tr:nth-child(even):hover td{background:#f0f2f5}
.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#f0f2f5;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:600;overflow:hidden}
.avatar.sm{width:32px;height:32px;font-size:12px}
.avatar.lg{width:72px;height:72px;font-size:24px}
.avatar.ph{background:linear-gradient(135deg,#d8d8d8,#b8b8b8)}
.avatar.ph svg{width:60%;height:60%;fill:#fff}
.avatar img{width:100%;height:100%;object-fit:cover}
.thumb{width:56px;height:36px;border-radius:6px;object-fit:cover;background:#f0f2f5;display:block}
.cover-ph{display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:repeating-linear-gradient(45deg,#f5f6f8,#f5f6f8 8px,#eceef1 8px,#eceef1 16px);color:var(--text-3);font-size:12px}

/* 结果/空态 */
.result{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 16px;text-align:center;color:var(--text-3)}
.result .ico{font-size:40px;margin-bottom:10px}
.result .rt{font-size:16px;color:var(--text);margin-top:10px}
.result .rs{font-size:12px;color:var(--text-3)}
.result.err .ico{color:var(--red)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 16px;text-align:center;color:var(--text-3)}
.empty .ico{font-size:40px;margin-bottom:10px}
.empty .et{margin-bottom:12px;max-width:280px;font-size:14px}

/* 卡片视图 */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.rcard{background:#fff;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.05);margin-bottom:12px;border:1px solid rgba(201,166,107,.14);overflow:hidden;display:flex;flex-direction:column}
.rcard .rc-cover{height:160px;background:#f0f2f5;position:relative}
.rcard .rc-cover img{width:100%;height:100%;object-fit:cover;display:block}
.rcard .rc-body{padding:14px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.rcard .rc-title{display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:600}
.rcard .rc-line{display:flex;align-items:center;gap:8px;color:var(--text-2);font-size:13px}
.rcard .rc-line svg{flex:none;color:var(--text-3)}
.rcard .rc-actions{margin-top:auto;padding-top:10px;border-top:1px solid var(--border);display:flex;gap:12px}

/* 抽屉 */
.drawer-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:none}
.drawer-mask.show{display:block}
.drawer{position:fixed;top:0;right:0;height:100vh;width:560px;max-width:92vw;background:#fff;box-shadow:var(--shadow-d);z-index:61;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.show{transform:translateX(0)}
.drawer .dh{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.drawer .db{padding:20px;overflow:auto;flex:1}
.drawer .df{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}

/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.mask.show{display:flex}
.modal{background:#fff;border-radius:8px;width:480px;max-width:92vw;max-height:88vh;display:flex;flex-direction:column;box-shadow:var(--shadow-d)}
.modal.wide{width:640px}
.modal.slim{width:420px}
.modal .mh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);font-size:16px;font-weight:600}
.modal .mb{padding:18px;overflow:auto}
.modal .mf{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.close-x{cursor:pointer;color:var(--text-3);font-size:18px}
.field{display:flex;gap:12px;margin-bottom:14px;align-items:flex-start}
.field .lb{width:82px;flex:0 0 82px;text-align:right;color:var(--text-2);font-size:13px;padding-top:8px}
.field .fc{flex:1;min-width:0}
.field .fc .input,.field .fc select{width:100%;padding:8px 10px;border:1px solid var(--border-d);border-radius:4px;font-size:13px;font-family:inherit}
.field .tip{font-size:12px;color:var(--text-3);margin-top:4px}
.field .err{font-size:12px;color:var(--red);margin-top:6px}
.readonly{background:#f5f7fa;color:var(--text-3)}

/* 图片上传区（对齐真实 admin-web：头像 120x120 / 封面 160x120 虚线框，提示独占一行） */
.uploader{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.up-box{width:120px;height:120px;border:1px dashed var(--border-d);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--text-3);cursor:pointer;background:#fafafa;position:relative;overflow:hidden;font-size:12px}
.up-box.cover{width:160px;height:120px;border-radius:8px}
.up-box.banner{width:280px;height:160px;border-radius:8px}
.up-box.video{width:160px;height:80px;border-radius:6px}
.up-box:hover{border-color:var(--blue);color:var(--blue)}
.up-box svg{width:22px;height:22px;fill:currentColor}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:14px;font-weight:600;color:var(--text)}
.card-hd .header-info{display:flex;align-items:center;gap:8px}
.card-hd .version-info{font-size:12px;color:var(--text-3);font-weight:400}
.home-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:16px}
.drawer-item{border:1px solid var(--border);border-radius:8px;padding:14px;background:#fafafa;margin-bottom:14px}
.drawer-item .di-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.drawer-item .di-hd .banner-index{font-weight:600;color:var(--blue);font-size:13px}
.caret svg{width:12px;height:12px;fill:currentColor}
.up-box img{width:100%;height:100%;object-fit:cover}
.up-box.uploading{border-style:solid;border-color:var(--blue)}
.up-tip{display:block;width:100%;font-size:12px;color:var(--text-3);line-height:1.5}
.spinner{width:22px;height:22px;border:2px solid #d9ecff;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.up-side{display:flex;flex-direction:column;gap:8px;flex:1}
.up-side .hint{font-size:12px;color:var(--text-3)}
.up-err{font-size:12px;color:var(--red)}
.up-ok{font-size:12px;color:var(--green)}
.up-actions{display:flex;gap:8px;flex-wrap:wrap}
.demo-note{font-size:11px;color:var(--orange);background:#fdf6ec;border:1px dashed #f5d0a0;border-radius:6px;padding:4px 8px;display:inline-block}

/* 手机预览（复刻真实 miniapp 学员端首页 apps/miniapp/src/pages/student/courses/index.vue） */
.phone-wrap{display:flex;gap:28px;flex-wrap:wrap}
.phone{position:relative;display:flex;flex-direction:column;width:340px;height:680px;background:#111;border-radius:34px;padding:10px;box-shadow:var(--shadow-d);flex:0 0 auto}
.phone .screen{flex:1;overflow-y:auto;border-radius:26px;position:relative;background:linear-gradient(180deg,#faf6f0 0%,#f5ede3 100%)}
/* 顶部导航栏（AppNavbar variant=default：纯白底 + 下边框） */
.m-nav{position:sticky;top:0;z-index:6;display:flex;align-items:center;justify-content:space-between;height:46px;padding:0 12px;background:#fff;border-bottom:1px solid #ebeef5}
.m-nav .loc{display:flex;align-items:center;gap:4px;color:#3d2e1f;font-size:14px;font-weight:500;cursor:pointer;min-width:0}
.m-nav .loc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-nav .loc svg{color:#8b7355;flex-shrink:0}
.m-nav .capsule{display:flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:13px;border:1px solid rgba(0,0,0,.08);background:rgba(0,0,0,.03);flex-shrink:0}
.m-nav .capsule i{width:4px;height:4px;border-radius:50%;background:#333}
.m-nav .capsule .sep{width:1px;height:14px;background:rgba(0,0,0,.14)}
.m-nav .capsule .ring{width:12px;height:12px;border-radius:50%;border:1.5px solid #333}
/* Banner 轮播（135deg 深→浅遮罩 + 金色指示点） */
.m-banner{position:relative;width:100%;height:164px;overflow:hidden;background:#e8ddd0}
.m-banner img{width:100%;height:100%;object-fit:cover;display:block}
.m-banner .bov{position:absolute;inset:0;background:linear-gradient(135deg,rgba(30,22,16,.75) 0%,rgba(30,22,16,.4) 50%,rgba(30,22,16,.1) 100%)}
.m-banner .bcap{position:absolute;left:16px;right:16px;bottom:26px}
.m-banner .bcap b{display:block;font-size:20px;font-weight:400;color:#fff;line-height:1.35;margin-bottom:6px;text-shadow:0 1px 4px rgba(0,0,0,.35);font-family:"BannerSerif","STKaiti","Kaiti SC","KaiTi","楷体",serif;letter-spacing:4px}
.m-banner .bdiv{display:flex;align-items:center;gap:5px;margin:8px 0 9px}
.m-banner .bdiv .bl{width:28px;height:1px;background:linear-gradient(90deg,rgba(217,185,138,0),#d9b98a)}
.m-banner .bdiv .bl:last-child{background:linear-gradient(90deg,#d9b98a,rgba(217,185,138,0))}
.m-banner .bdiv .bd{width:4px;height:4px;background:#e3c69a;transform:rotate(45deg)}
.m-banner .bcap span{display:block;font-size:12px;color:rgba(255,250,242,.88);line-height:1.6;text-shadow:0 .5px 2px rgba(0,0,0,.25);font-family:"BannerSerif","STKaiti","Kaiti SC","KaiTi","楷体",serif;letter-spacing:3px}
.m-dots{position:absolute;left:0;right:0;bottom:9px;display:flex;justify-content:center;gap:5px}
.m-dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4)}
.m-dots i.on{background:#c9a66b}
/* 通用 section 标题（金色线性图标 + 标题 + 更多） */
.m-sec{padding:16px 14px 0}
.m-sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.m-sh .mst{display:flex;align-items:center;gap:6px}
.m-sh .mst svg{color:#c9a66b;flex-shrink:0}
.m-sh .mst b{font-size:15px;font-weight:600;color:#3d2e1f}
.m-sh .more{display:flex;align-items:center;gap:1px;font-size:11px;color:#8b7355;cursor:pointer}
/* 师资（横向滚动 + 奶油渐变圆形头像 + 缺省人形剪影 + 姓名/专长两行） */
.m-trow{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
.m-teacher{display:flex;flex-direction:column;align-items:center;width:74px;flex-shrink:0;cursor:pointer;background:#fff;border:1px solid #ebe7e1;border-radius:10px;padding:8px 6px;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.m-tav{width:54px;height:54px;border-radius:50%;overflow:hidden;border:1px solid rgba(201,166,107,.3);background:linear-gradient(135deg,#f5e6d3 0%,#e8d5c4 100%);display:flex;flex-direction:column;align-items:center;justify-content:center}
.m-tav img{width:100%;height:100%;object-fit:cover}
.m-tav .tv-ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.m-tav .tv-head{width:19px;height:19px;border-radius:50%;background:#d8c3a4;margin-bottom:2px}
.m-tav .tv-body{width:36px;height:25px;border-radius:18px 18px 0 0;background:#d8c3a4;margin-bottom:-8px}
/* 真实 miniapp 缺省头像结构：avatar-placeholder / avatar-head / avatar-body */
.m-tav .avatar-placeholder{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:#f4ebdf}
.m-tav .avatar-head{width:19px;height:19px;border-radius:50%;background:#d8c3a4;margin-bottom:2px}
.m-tav .avatar-body{width:36px;height:25px;border-radius:18px 18px 0 0;background:#d8c3a4;margin-bottom:-8px}
.m-tn{display:block;font-size:12px;font-weight:500;color:#3d2e1f;margin-top:6px;width:100%;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-ts{display:block;font-size:10px;color:#8b7355;width:100%;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
/* 推荐课程（左图右文横向卡片） */
.m-clist{display:flex;flex-direction:column;gap:10px}
.m-course{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.92);border:1px solid rgba(201,166,107,.12);border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.04);padding:8px;cursor:pointer}
.m-cimg{width:62px;height:62px;border-radius:8px;overflow:hidden;flex-shrink:0;background:linear-gradient(135deg,#2d2418 0%,#5a4632 100%);display:flex;align-items:center;justify-content:center}
.m-cimg img{width:100%;height:100%;object-fit:cover}
.m-cimg .cph{font-size:10px;color:rgba(201,166,107,.55);letter-spacing:1px}
.m-cinfo{display:flex;flex-direction:column;min-width:0}
.m-cname{font-size:14px;font-weight:600;color:#3d2e1f;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-cdesc{font-size:11px;color:#8b7355;line-height:1.5}
/* 舞蹈视频（真实结构：多卡片列表，每卡封面 + 金色圆形播放按钮 + 可选时长 + 标题/描述） */
.m-vlist{display:flex;flex-direction:column;gap:10px}
.m-vcard{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.05);border:1px solid rgba(201,166,107,.12)}
.m-vcover{position:relative;width:100%;height:160px;overflow:hidden;background:#ddd}
.m-vcover img{width:100%;height:100%;object-fit:cover;display:block}
.m-vov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.4))}
.m-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:rgba(201,166,107,.9);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.m-play svg{color:#fff}
.m-vdur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;line-height:1.4;padding:2px 6px;border-radius:10px}
.m-vinfo{padding:10px 12px}
.m-vtitle{font-size:14px;font-weight:600;color:#3d2e1f;display:block}
.m-vdesc{font-size:11px;color:#8b7355;margin-top:4px;display:block;line-height:1.5}
/* 视频 */
/* 底部 TabBar（对齐 F6.0 学员端原型口径 4 Tab：首页/排期/AI 助手/我的；AI 为第 3 个一级 Tab，激活 #8b7355，无悬浮 FAB） */
.m-tabbar{position:sticky;bottom:0;z-index:6;display:flex;background:#fff;border-top:1px solid #f5f5f5;box-shadow:0 -2px 12px rgba(0,0,0,.04);padding:7px 0 11px;margin-top:16px}
.m-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;color:#999;cursor:pointer}
.m-tab svg{color:#999}
.m-tab span{font-size:10px;color:#999}
.m-tab.on svg{color:#8b7355}
.m-tab.on span{color:#8b7355;font-weight:500}
.m-tab .ind{position:absolute;bottom:-3px;width:20px;height:2px;border-radius:1px;background:linear-gradient(90deg,#c9a66b,#d9a7b0)}
.ph-hidden-note{font-size:11px;color:var(--text-3);text-align:center;padding:14px}
.m-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:60px 20px;color:#909399;font-size:13px}
.mod-tbl td{vertical-align:middle}
.mod-tbl .mtype-tag{white-space:nowrap}
.mod-tbl .m-summary{color:var(--text-2);font-size:13px}
.mod-tbl .drag-cell{display:flex;align-items:center;gap:8px}
.pager{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:16px;font-size:13px;color:var(--text-3)}
.pager .pg{min-width:28px;height:28px;border:1px solid var(--border-d);border-radius:4px;background:#fff;display:inline-flex;align-items:center;justify-content:center;color:var(--text-2);cursor:pointer}
.pager .pg.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pager .pg.dis{color:var(--gray-l);background:#f5f7fa;cursor:not-allowed}

/* Toast */
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 18px;border-radius:6px;z-index:200;font-size:13px;box-shadow:var(--shadow-d);display:none}
.toast.show{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;top:40px}to{opacity:1;top:60px}}
.toast.success{color:#67c23a}
.toast.error{color:#f56c6c}
.toast.info{color:#fff}

.note-bar{display:flex;gap:8px;align-items:flex-start;background:#fff8ec;border:1px dashed #e0b070;color:#a9702a;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:12px;line-height:1.6}
.note-bar.warn{background:#f0f9eb;border:1px solid #c2e7b0;border-left:4px solid #67c23a;border-radius:4px;padding:8px 10px;font-size:12px;color:#4e7a35;margin:8px 0;line-height:1.6}
.mock-tag{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:8px;font-size:10px;line-height:1.5;background:rgba(255,244,224,.14);color:#d0a35c;border:1px solid rgba(208,163,92,.4);vertical-align:middle}
.switch{width:40px;height:22px;border-radius:11px;background:var(--gray-l);position:relative;cursor:pointer;transition:.2s;display:inline-block;vertical-align:middle}
.switch.on{background:var(--green)}
.switch i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.switch.on i{left:20px}
.mod-row{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.mod-row.dis{opacity:.6}
.mod-row .mname{font-weight:600;font-size:15px}
.mod-row .mtype{font-size:12px;color:var(--text-3)}
.mod-row .mright{margin-left:auto;display:flex;align-items:center;gap:14px}
.drag-handle{cursor:grab;color:var(--text-3);font-size:16px;letter-spacing:1px;user-select:none;padding:0 2px}
.drag-handle:active{cursor:grabbing}
.ord-no{min-width:22px;height:22px;border-radius:50%;background:#ecf5ff;color:var(--blue);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
.mod-row.dragging{opacity:.45}
.mod-row.drag-over{border-color:var(--blue);box-shadow:0 0 0 2px rgba(64,158,255,.25)}
.multi{border:1px solid var(--border-d);border-radius:6px;padding:10px;max-height:180px;overflow:auto;background:#fff}

@media(max-width:1080px){.grid{grid-template-columns:repeat(2,1fr)}}

/* --- 上传区渲染（对齐真实 admin-web：头像 120x120 / 封面 160x120 / Banner 280x160，提示独占一行） --- */
function uploaderClass(variant){
  if(variant==='banner') return 'banner';
  if(variant==='cover'||variant==='video') return 'cover';
  return '';
}
function uploaderPlaceholder(variant){
  if(variant==='banner') return '上传 Banner 图片';
  if(variant==='video') return '上传封面（16:9）';
  if(variant==='cover') return '上传封面';
  return '上传头像';
}
function renderUploader(upload, ctx, variant, tip){
  var u = upload, s = u.state, cls = uploaderClass(variant||'avatar');
  var tipText = tip || (ctx==='profile' ? '支持 JPG / PNG / WEBP，最大 5MB' : '支持 JPG/PNG/WEBP，最大 5MB');
  var box = '';
  if(s==='idle') box = '<div class="up-box '+cls+'" onclick="imageChoose(\''+ctx+'\',\'ok\')">'+iconSvg('plus')+'<span>'+uploaderPlaceholder(variant||'avatar')+'</span></div>';
  else if(s==='preview') box = '<div class="up-box '+cls+'"><img src="'+imgSrc(u.preview)+'" alt="预览"></div>';
  else if(s==='uploading') box = '<div class="up-box '+cls+' uploading"><div class="spinner"></div><span>上传中…</span></div>';
  else if(s==='success') box = '<div class="up-box '+cls+'"><img src="'+imgSrc(u.url)+'" alt="已上传"></div>';
  else box = '<div class="up-box '+cls+'" style="border-style:solid;border-color:var(--red);color:var(--red)">×</div>';

  var extra = '';
  if(s==='preview'){
    extra = '<div class="hint">已选择，尚未上传</div>'+
      '<div class="up-actions"><button class="btn sm primary" onclick="imageUpload(\''+ctx+'\')">上传</button>'+
      '<button class="btn sm" onclick="imageChoose(\''+ctx+'\',\'ok\')">更换</button>'+
      '<button class="btn sm" onclick="imageRemove(\''+ctx+'\')">移除</button></div>';
  } else if(s==='uploading'){
    extra = '<div class="hint">正在上传到对象存储…（原型模拟，未接通）</div>'+
      '<div class="up-actions"><button class="btn sm" onclick="imageResolve(\''+ctx+'\',true)">模拟成功</button>'+
      '<button class="btn sm" onclick="imageResolve(\''+ctx+'\',false)">模拟失败</button></div>';
  } else if(s==='success'){
    extra = '<div class="up-ok">✓ 上传成功（原型模拟）</div>'+
      '<div class="up-actions"><button class="btn sm" onclick="imageChoose(\''+ctx+'\',\'ok\')">更换</button>'+
      '<button class="btn sm" onclick="imageRemove(\''+ctx+'\')">移除</button></div>';
  } else if(s==='format-error'){
    extra = '<div class="up-err">仅支持 JPG/PNG/WEBP 格式</div>'+
      '<div class="up-actions"><button class="btn sm" onclick="imageChoose(\''+ctx+'\',\'ok\')">重新选择</button></div>';
  } else if(s==='size-error'){
    extra = '<div class="up-err">图片不能超过 5MB</div>'+
      '<div class="up-actions"><button class="btn sm" onclick="imageChoose(\''+ctx+'\',\'ok\')">重新选择</button></div>';
  } else if(s==='fail'){
    extra = '<div class="up-err">上传失败，请重试</div>'+
      '<div class="up-actions"><button class="btn sm primary" onclick="imageUpload(\''+ctx+'\')">重试</button>'+
      '<button class="btn sm" onclick="imageRemove(\''+ctx+'\')">取消</button></div>';
  }
  return '<div class="uploader">'+box+'<div class="up-tip">'+tipText+'</div>'+extra+'</div>';
}
function uploadHolder(ctx){
  if(ctx==='user') return STATE.userDialog.upload;
  if(ctx==='classroom') return STATE.classroomDialog.upload;
  if(ctx==='profile') return STATE.profileUpload;
  if(ctx==='drawer') return STATE.drawer.upload;
  return STATE.userDialog.upload;
}
function drawerFieldForType(t){ return t==='video' ? 'cover_url' : 'image_url'; }
function imageChoose(ctx, kind){
  var u = uploadHolder(ctx);
  var preview = ctx==='classroom' ? 'ROOM1' : (ctx==='drawer' ? 'BANNER2' : 'BANNER2');
  if(kind==='bad-format'){ u.state='format-error'; u.preview=''; toast('仅支持 JPG/PNG/WEBP 格式','error'); }
  else if(kind==='big'){ u.state='size-error'; u.preview=''; toast('图片不能超过 5MB','error'); }
  else { u.state='preview'; u.preview = preview; u.name='demo.jpg'; }
  if(ctx==='drawer'){
    var it=(STATE.drawer.form.items||[])[STATE.drawer.editIndex||0];
    if(it){ it._state=u.state; it._preview=u.preview; }
  }
  renderAll();
}
function imageUpload(ctx){ var u = uploadHolder(ctx); u.state='uploading'; renderAll(); }
function imageResolve(ctx, ok){
  var u = uploadHolder(ctx);
  if(ok){
    u.state='success'; u.url = u.preview;
    if(ctx==='drawer'){
      var it=(STATE.drawer.form.items||[])[STATE.drawer.editIndex||0];
      if(it){ it[drawerFieldForType(STATE.drawer.type)] = u.preview; it._state='success'; }
    }
    toast('上传成功（原型模拟）','success');
  } else { u.state='fail'; toast('上传失败，请重试','error'); }
  renderAll();
}
function imageRemove(ctx){
  var u = uploadHolder(ctx); u.state='idle'; u.preview=''; u.url='';
  if(ctx==='drawer'){
    var it=(STATE.drawer.form.items||[])[STATE.drawer.editIndex||0];
    if(it){ it[drawerFieldForType(STATE.drawer.type)]=''; it._state='idle'; it._preview=''; }
  }
  renderAll();
}

function moduleTypeLabel(t){ return {banner:'Banner 轮播',teachers:'师资团队',courses:'推荐课程',video:'舞蹈视频'}[t]||t; }
function moduleTagType(t){ return {banner:'primary',teachers:'success',courses:'warn',video:'danger'}[t]||''; }
function moduleSummary(m){
  if(m.type==='banner'){ var n=(m.items||[]).length; return n>0?'已配置 '+n+' 个 Banner':'未配置'; }
  if(m.type==='teachers'){ var ids=(m.config&&m.config.teacher_ids)||[]; return ids.length>0?'已选 '+ids.length+' 位教师':'未配置'; }
  if(m.type==='courses'){ var cids=(m.config&&m.config.course_ids)||[]; return cids.length>0?'已选 '+cids.length+' 门课程':'未配置'; }
  if(m.type==='video'){ var vn=(m.items||[]).filter(function(it){return it&&it.video_url;}).length; return vn>0?'已配置 '+vn+' 个视频':'未配置'; }
  return '未知类型';
}
function resetHomeModule(type){
  var m=homeModule(type); if(!m) return;
  var defaults={
    banner:{type:'banner',name:'Banner 轮播',enabled:m.enabled,sort:m.sort,items:[]},
    teachers:{type:'teachers',name:'师资团队',enabled:m.enabled,sort:m.sort,config:{teacher_ids:[]}},
    courses:{type:'courses',name:'推荐课程',enabled:m.enabled,sort:m.sort,config:{course_ids:[]}},
    video:{type:'video',name:'舞蹈视频',enabled:m.enabled,sort:m.sort,items:[]}
  };
  var idx=STATE.home.modules.indexOf(m);
  if(idx>=0) STATE.home.modules[idx]=defaults[type];
  STATE.home.dirty=true;
  toast('已重置为默认配置（原型模拟）','success');
  renderAll();
}

function toggleHomeModule(type){
  var m=homeModule(type); m.enabled=!m.enabled; STATE.home.dirty=true;
  toast((m.enabled?'已启用':'已停用')+'「'+m.name+'」（草稿）','success'); markDirtyRender();
}
/* 排序：以 sort 字段升序排列；拖动后重排并重写连续排序值 1..n */
function sortedModules(){ return STATE.home.modules.slice().sort(function(a,b){return a.sort-b.sort;}); }
function moduleIndex(type){ var mods=sortedModules(); for(var k=0;k<mods.length;k++){ if(mods[k].type===type) return k; } return -1; }
function reorderHomeModule(fromType, toIndex){
  var mods = sortedModules();
  var from = moduleIndex(fromType); if(from<0) return;
  if(toIndex<0) toIndex=0; if(toIndex>=mods.length) toIndex=mods.length-1;
  if(from===toIndex) return;
  var item = mods.splice(from,1)[0];
  mods.splice(toIndex,0,item);
  mods.forEach(function(m,i){ m.sort=i+1; });
  STATE.home.dirty=true; toast('已调整模块顺序（草稿）','info'); markDirtyRender();
}
/* 保留程序化上/下移动（供键盘/无障碍与脚本驱动），底层复用 reorder */
function moveHomeModule(type, dir){
  var mods = sortedModules();
  var i = moduleIndex(type); if(i<0) return;
  var j = i+dir; if(j<0||j>=mods.length) return;
  reorderHomeModule(type, j);
}
/* 拖动排序事件：不在拖动过程中整页重渲染，避免打断原生 drag；放下后由 reorder 统一重排 */
function onModuleDragStart(e,type){
  STATE.dragType=type;
  if(e&&e.dataTransfer){ e.dataTransfer.effectAllowed='move'; }
  if(e&&e.currentTarget&&e.currentTarget.classList){ e.currentTarget.classList.add('dragging'); }
}
function onModuleDragOver(e,type){
  if(e&&e.preventDefault) e.preventDefault();
  if(!STATE.dragType||STATE.dragType===type) return;
  STATE.dragOver=type;
  if(e&&e.currentTarget&&e.currentTarget.classList){ e.currentTarget.classList.add('drag-over'); }
}
function onModuleDragLeave(e){ if(e&&e.currentTarget&&e.currentTarget.classList){ e.currentTarget.classList.remove('drag-over'); } }
function onModuleDrop(e,type){
  if(e&&e.preventDefault) e.preventDefault();
  var from=STATE.dragType; STATE.dragType=null; STATE.dragOver=null;
  if(!from||from===type) return;
  reorderHomeModule(from, moduleIndex(type));
}
function onModuleDragEnd(e){ STATE.dragType=null; STATE.dragOver=null; renderAdminPage(); }
function markDirtyRender(){ STATE.home.dirty=true; renderAdminPage(); }

function drawerItem(key, val, idx){
  var f=STATE.drawer.form; if(!f.items) f.items=[{}];
  var i=(idx==null?0:idx); if(!f.items[i]) f.items[i]={};
  f.items[i][key]=val;
}
function saveDraft(){
  var d=STATE.drawer, f=d.form, t=d.type;
  var items=f.items||[];
  if(t==='banner'){
    if(items.length===0){ toast('请至少添加 1 个 Banner','error'); return; }
    if(items.some(function(it){return !it.image_url;})){ toast('每个 Banner 必须上传图片','error'); return; }
    if(items.some(function(it){return !it.title || !String(it.title).trim();})){ toast('每个 Banner 必须填写标题','error'); return; }
  }
  if(t==='teachers'){
    if(!(f.teacher_ids||[]).length){ toast('请至少选择 1 位教师','error'); return; }
  }
  if(t==='courses'){
    if(!(f.course_ids||[]).length){ toast('请至少选择 1 门课程','error'); return; }
  }
  if(t==='video'){
    if(items.length===0){ toast('请至少添加 1 个视频','error'); return; }
    if(items.some(function(it){return !it.cover_url;})){ toast('每个视频必须上传封面图','error'); return; }
    if(items.some(function(it){return !it.title || !String(it.title).trim();})){ toast('每个视频必须填写标题','error'); return; }
    if(items.some(function(it){return !it.video_url;})){ toast('每个视频必须上传或填写视频地址','error'); return; }
  }
  var m=homeModule(t);
  if(t==='banner'){
    m.items = items.filter(function(it){ return it.image_url && it.title && String(it.title).trim(); }).map(function(it){
      return {image_url:it.image_url, title:it.title, subtitle:it.subtitle||'', link_url:it.link_url||''};
    });
  } else if(t==='teachers'){
    m.config = {teacher_ids:(f.teacher_ids||[]).slice()};
  } else if(t==='courses'){
    m.config = {course_ids:(f.course_ids||[]).slice()};
  } else if(t==='video'){
    m.items = items.filter(function(it){ return it.video_url && it.cover_url && it.title && String(it.title).trim(); }).map(function(it){
      return {title:it.title, description:it.description||'', cover_url:it.cover_url, video_url:it.video_url};
    });
  }
  STATE.home.dirty=true;
  STATE.drawer.open=false;
  toast('草稿已保存（原型模拟）','success');
  renderAll();
}

  html += '<div class="note-bar warn">发布后草稿将作为新版本生效，用户小程序会立即看到变更。</div>';
  html += '<h4 style="margin:4px 0 12px;font-size:14px;color:var(--text)">本次发布内容概览</h4>';
  html += '<div style="display:flex;flex-direction:column;gap:8px">';
  mods.forEach(function(m){
    html += '<div style="display:flex;align-items:center;gap:12px;padding:8px 12px;background:#f8f9fa;border-radius:6px">'+
      '<span class="tag '+moduleTagType(m.type)+'">'+moduleTypeLabel(m.type)+'</span>'+
      '<span class="tag '+(m.enabled?'success':'info')+'">'+(m.enabled?'已启用':'已停用')+'</span>'+
      '<span style="font-size:13px;color:var(--text-2)">'+publishSummary(m)+'</span></div>';
  });
  html += '</div>';
  html += '<div style="margin-top:14px"><label style="display:flex;gap:8px;align-items:center;cursor:pointer"><input type="checkbox" '+(STATE.publish.confirmFail?'checked':'')+' onchange="togglePublishFail()"> <span class="demo-note">演示用：模拟发布失败</span></label></div>';
  html += '</div><div class="mf"><button class="btn" onclick="closePublish()">取消</button><button class="btn primary" onclick="doPublish()">确认发布</button></div>';
  return '<div class="modal">'+html+'</div>';
}
function doPublish(){
  if(STATE.publish.confirmFail){
    STATE.home.publishResult='fail';
    STATE.publish.open=false;
    toast('发布失败：草稿校验未通过。线上仍为旧版本 v'+STATE.home.publishedVersion,'error');
    renderAll(); return;
  }
  STATE.home.publishedVersion = (STATE.home.publishedVersion||0)+1;
  STATE.home.dirty=false;
  STATE.home.publishResult='success';
  STATE.home.lastPublishedAt='2026-10-19 18:20';
  STATE.publish.open=false;
  toast('发布成功：线上版本 v'+STATE.home.publishedVersion+'（原型模拟）','success');
  renderAll();
}

/* ================= 弹窗/抽屉 统一渲染 ================= */
function openModal(html, size){
  STATE.modalOpen = true;
  STATE.modalSize = size||'';
  STATE.modalHtml = html.replace('<div class="modal">','').replace(/<\/div>$/,'').replace(/^<div class="modal[^>]*>/,'');
  renderAll();
}
function closeModal(){ STATE.modalOpen=false; STATE.modalHtml=''; STATE.userDialog.open=false; STATE.classroomDialog.open=false; STATE.publish.open=false; STATE.profileEdit=null; renderAll(); }
function renderLogoutConfirm(){
  return '<div class="modal"><div class="mh"><span>退出确认</span><span class="close-x" onclick="closeModal()">✕</span></div>'+
    '<div class="mb">确定要退出登录吗？（原型模拟）</div>'+
    '<div class="mf"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="doLogout()">确定退出</button></div></div>';
}

/* ---------- 主渲染 ---------- */
function renderAll(){
  renderTopbar();
  renderAdminSide();
  renderHeader();
  renderAdminPage();
  // 抽屉
  if(STATE.drawer.open){ renderDrawer(); } else { q('drawer-box').className='drawer'; q('drawer-mask').className='drawer-mask'; q('drawer-box').innerHTML=''; }
  // 弹窗（互斥：用户弹窗 / 教室弹窗 / 个人资料 / 发布）
  if(STATE.userDialog.open){ q('modal-box').className='modal'; q('modal-box').innerHTML=renderUserDialog(); q('mask').className='mask show'; }
  else if(STATE.classroomDialog.open){ q('modal-box').className='modal'; q('modal-box').innerHTML=renderClassroomDialog(); q('mask').className='mask show'; }
  else if(STATE.profileEdit){ q('modal-box').className='modal'; q('modal-box').innerHTML=renderProfileDialog(); q('mask').className='mask show'; }
  else if(STATE.publish.open){ q('modal-box').className='modal'; q('modal-box').innerHTML=renderPublishDialog(); q('mask').className='mask show'; }
  else if(STATE.modalOpen){ q('modal-box').className='modal '+(STATE.modalSize||''); q('modal-box').innerHTML=STATE.modalHtml; q('mask').className='mask show'; }
  else { q('modal-box').className='modal'; q('modal-box').innerHTML=''; q('mask').className='mask'; }
  // toast
  var t=q('toast'); if(STATE.toast && STATE.toast.msg){ t.className='toast show '+(STATE.toast.type||'info'); } else { t.className='toast'; }
}
renderAll();
</script>
</body>
</html>
