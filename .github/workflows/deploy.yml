name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            set -e
            cd /opt/dance-saas
            
            # 1. 配置 Git（避免 HTTP/2 网络问题）
            git config --global http.version HTTP/1.1
            git config --global http.postBuffer 524288000
            git config --global core.compression -1
            
            # 2. 确保使用 HTTPS 协议
            git remote set-url origin https://github.com/lantercode/class_booking_system.git
            
            # 3. 拉取最新代码（最多重试 3 次）
            for i in 1 2 3; do
              if git pull origin main; then
                break
              fi
              echo "️  Pull failed, retrying ($i/3)..."
              sleep 5
            done
            
            # 4. 创建 .env.prod 如果不存在（从环境变量或默认值）
            if [ ! -f .env.prod ]; then
              echo "⚠️  .env.prod not found, creating from template..."
              cp .env.example .env.prod 2>/dev/null || echo "# Auto-generated" > .env.prod
            fi
            
            # 5. 构建前端（pnpm workspace 项目，不能用 npm）
            echo "🔨 Building frontend..."
            
            # 安装 pnpm（如果未安装）
            if ! command -v pnpm &> /dev/null; then
              echo "Installing pnpm..."
              npm install -g pnpm
            fi
            
            # 从根目录安装依赖（workspace 需要根目录执行）
            cd /opt/dance-saas
            pnpm install --frozen-lockfile
            
            # 构建 admin-web
            cd apps/admin-web
            pnpm run build
            mkdir -p /var/www/admin
            cp -r dist/* /var/www/admin/
            echo "✅ Frontend built and deployed"
            
            # 6. 配置 Nginx（带缓存控制策略）
            NGINX_CONF='server {
    listen 80 default_server;
    server_name _;
    root /var/www/admin;
    index index.html;

    location / {
        # index.html 不缓存，确保用户始终获取最新版本
        if ($uri = /index.html) {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长期缓存（文件名含哈希）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}'
            echo "$NGINX_CONF" > /etc/nginx/sites-available/dance-saas-ip.conf
            ln -sf /etc/nginx/sites-available/dance-saas-ip.conf /etc/nginx/sites-enabled/
            nginx -t && systemctl reload nginx
            echo "✅ Nginx configured with cache-control headers"
            
            # 7. 重新构建并启动容器
            cd /opt/dance-saas
            docker compose -f infra/docker/docker-compose.prod.yml \
              --env-file .env.prod \
              up -d --build
            
            # 8. 清理无用镜像
            docker image prune -f
            
            echo "✅ Deploy succeeded"