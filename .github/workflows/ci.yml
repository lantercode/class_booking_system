name: CI (Lint & Test)

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # 1. 后端检查
  backend:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python & uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (Ruff)
        run: uv run ruff check .

      # T7.3.2: mypy 基线 ratchet —— 存量 234 个错误不做全量修复，
      # 仅要求错误数不超过基线文件 apps/api/scripts/mypy-baseline.txt。
      # 超过基线则失败并提示如何更新基线。
      - name: Type Check (Mypy baseline ratchet)
        run: bash scripts/mypy_baseline_check.sh

      - name: Run Alembic Migrations
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test

      - name: Test (Pytest)
        run: uv run pytest tests/unit --tb=short -q
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379/0

      # T7.3.1: integration 测试入 CI。
      # 种子数据由 tests/conftest.py 的 session 级 fixture 自建（租户/角色/权限/用户），
      # schema 依赖上一步 alembic upgrade head。
      # 以下为已知存量失败，按技术债逐条排除，修复后移除对应条目：
      #   D-F7.3-1: test_admin_user_real.py —— 10 个失败（user:create 403，依赖运行中服务与特定数据）
      #   D-F7.3-2: test_tenant_isolation.py —— 3 个失败（asyncpg 事件循环冲突，老问题）
      #   D-F7.3-3: test_user_api.py::TestUserCRUD::test_create_user_success —— 1 个失败（405）
      #   D-F7.3-4: test_booking_ownership.py —— fixture ERROR（同 D-F7.3-1 的 403 根因）
      #   D-F7.3-5: 以下 2 项是「migration 回归」断言，依赖 dev 库预存量业务数据
      #             （bookings/membership_cards 非空），CI 空库必然失败，
      #             需改造为测试内自建数据后方可恢复：
      #             - test_booking_fk_membership_card.py::...::test_migration_cleanup_clears_orphan_and_readds_fk
      #             - test_status_check_constraints.py::TestExistingDataIntact（整类）
      - name: Integration Test (Pytest)
        run: >
          uv run pytest tests/integration --tb=short -q
          --ignore=tests/integration/test_admin_user_real.py
          --ignore=tests/integration/test_tenant_isolation.py
          --ignore=tests/integration/test_booking_ownership.py
          --deselect tests/integration/test_user_api.py::TestUserCRUD::test_create_user_success
          --deselect tests/integration/test_booking_fk_membership_card.py::TestBookingFkMigrationLogic::test_migration_cleanup_clears_orphan_and_readds_fk
          --deselect tests/integration/test_status_check_constraints.py::TestExistingDataIntact
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379/0

  # 2. 前端检查
  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm lint
        working-directory: apps/admin-web

      - name: Build all apps
        run: pnpm build

      # T7.3.3: miniapp 不在根 pnpm build 内，单独补类型检查（vue-tsc --noEmit）
      - name: Type Check (miniapp)
        run: pnpm --filter dance-miniapp type-check