services:
  postgres:
    image: postgres:15-alpine
    container_name: dance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dance-redis
    restart: unless-stopped
    # 必须显式提供 REDIS_PASSWORD：为空时 redis-server 会因缺少参数直接退出
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required in .env.prod}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    container_name: dance-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      # 时区：影响日志时间与本地时间展示（数据库仍用 timestamptz 存绝对时间）
      TZ: ${TZ:-Asia/Shanghai}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-120}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      # JWT 黑名单（登出 / 轮换时写入 jti）
      ENABLE_TOKEN_BLACKLIST: ${ENABLE_TOKEN_BLACKLIST:-true}
      REDIS_TOKEN_BLACKLIST_PREFIX: ${REDIS_TOKEN_BLACKLIST_PREFIX:-blacklist:}
      CORS_ORIGINS: ${CORS_ORIGINS}
      WECHAT_APP_ID: ${WECHAT_APP_ID}
      WECHAT_SECRET: ${WECHAT_SECRET}
      # 文件存储（阿里云 OSS，ECS RAM 角色临时凭证；AK/SK 不落盘）
      STORAGE_BACKEND: oss
      OSS_ENDPOINT: ${OSS_ENDPOINT}
      OSS_REGION: ${OSS_REGION}
      OSS_BUCKET: ${OSS_BUCKET}
      OSS_CREDENTIALS_MODE: ${OSS_CREDENTIALS_MODE}
      OSS_ROLE_NAME: ${OSS_ROLE_NAME}
      # 仅 OSS_CREDENTIALS_MODE=static 时需要；ecs_role 模式留空
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      # 私有桶留空即可（走预签名 URL）；仅公读 + CDN 场景填写
      OSS_PUBLIC_BASE_URL: ${OSS_PUBLIC_BASE_URL:-}
      OSS_PRESIGN_TTL_SECONDS: ${OSS_PRESIGN_TTL_SECONDS:-3600}
      # 后台定时任务
      AUTO_FINISH_ENABLED: ${AUTO_FINISH_ENABLED:-true}
      AUTO_FINISH_GRACE_MINUTES: ${AUTO_FINISH_GRACE_MINUTES:-30}
      AUTO_CANCEL_UNDERBOOKED_ENABLED: ${AUTO_CANCEL_UNDERBOOKED_ENABLED:-true}
      PENDING_CARD_CANCEL_ENABLED: ${PENDING_CARD_CANCEL_ENABLED:-true}
      PENDING_CARD_CANCEL_DAYS: ${PENDING_CARD_CANCEL_DAYS:-90}
      # AI 对话限流（按登录用户，仅 /api/v1/ai/chat）
      AI_CHAT_RATE_LIMIT: ${AI_CHAT_RATE_LIMIT:-20}
      AI_CHAT_RATE_WINDOW: ${AI_CHAT_RATE_WINDOW:-60}
      # AI / 火山方舟（默认关闭；启用需同时配置 ARK_API_KEY 与 AI_LLM_ENABLED_TENANTS）
      ARK_API_KEY: ${ARK_API_KEY:-}
      AI_LLM_ENABLED: ${AI_LLM_ENABLED:-false}
      AI_LLM_BASE_URL: ${AI_LLM_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      AI_LLM_MODEL: ${AI_LLM_MODEL:-doubao-seed-2-1-lite-260915}
      AI_LLM_ALLOWED_MODELS: ${AI_LLM_ALLOWED_MODELS:-doubao-seed-2-1-lite-260915,doubao-seed-2-1-pro-260915,doubao-seed-2-0-lite-260428,doubao-seed-evolving}
      AI_LLM_TIMEOUT_MS: ${AI_LLM_TIMEOUT_MS:-6000}
      AI_LLM_TOTAL_BUDGET_MS: ${AI_LLM_TOTAL_BUDGET_MS:-15000}
      AI_LLM_MAX_TOKENS: ${AI_LLM_MAX_TOKENS:-800}
      AI_LLM_MAX_RETRIES: ${AI_LLM_MAX_RETRIES:-2}
      AI_LLM_MAX_TOOL_LOOPS: ${AI_LLM_MAX_TOOL_LOOPS:-2}
      AI_LLM_READONLY_ONLY: ${AI_LLM_READONLY_ONLY:-true}
      AI_LLM_ENABLED_TENANTS: ${AI_LLM_ENABLED_TENANTS:-}
      # 异步任务队列（阶段 1-6）：true 时延迟任务由 Worker 消费，旧排期直写扫描自动下线
      TASK_WORKER_ENABLED: ${TASK_WORKER_ENABLED:-false}
      TASK_WORKER_BATCH_SIZE: ${TASK_WORKER_BATCH_SIZE:-20}
      TASK_WORKER_LEASE_SECONDS: ${TASK_WORKER_LEASE_SECONDS:-120}
      TASK_WORKER_MAX_ATTEMPTS: ${TASK_WORKER_MAX_ATTEMPTS:-3}
      TASK_WORKER_TICK_SECONDS: ${TASK_WORKER_TICK_SECONDS:-1.0}
      # 实时推送（SSE / WebSocket）
      NOTIFY_HEARTBEAT_SECONDS: ${NOTIFY_HEARTBEAT_SECONDS:-25}
      NOTIFY_MAX_CONNECTIONS_PER_USER: ${NOTIFY_MAX_CONNECTIONS_PER_USER:-3}
      NOTIFY_MAX_EVENTS_PER_SECOND: ${NOTIFY_MAX_EVENTS_PER_SECOND:-20}
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
  redisdata:
