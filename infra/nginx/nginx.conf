# =====================================================
# Dance SaaS - Nginx Production Config (Stage B / HTTPS)
# =====================================================
# Deploy to: /etc/nginx/sites-available/dance-saas
# Enable:    ln -sf /etc/nginx/sites-available/dance-saas /etc/nginx/sites-enabled/
# Reload:    nginx -t && systemctl reload nginx
#
# BEFORE USE: replace all "yourdomain.com" with your real domain.
# =====================================================

# --- admin.yourdomain.com : Admin Web (Vue static + API reverse proxy) ---
server {
    listen 80;
    server_name admin.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/admin.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/admin;
    index index.html;

    # 文件上传：图片 5MB、视频 200MB，留出 multipart 开销余量（默认 1M 会直接 413）
    client_max_body_size 250M;
    # 单个请求体传输超时（默认 60s，弱网传大文件容易中断）
    client_body_timeout 300s;

    # SPA history-mode routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API proxy (no CORS needed for admin)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 视频上传会触发后端 ffmpeg 转码（最长 600s），默认 60s 必然 504
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}

# --- api.yourdomain.com : Public API (WeChat MiniProgram uses this) ---
server {
    listen 80;
    server_name api.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.yourdomain.com;

    # Note: Uses admin domain certificate (covers both domains via SAN)
    ssl_certificate     /etc/letsencrypt/live/admin.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 文件上传：图片 5MB、视频 200MB，留出 multipart 开销余量
    client_max_body_size 250M;
    client_body_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 视频上传会触发后端 ffmpeg 转码（最长 600s），默认 60s 必然 504
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}